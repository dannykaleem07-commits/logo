<h1>7 Notice of intended proceedings (invented)</h1>
<p>(1) A claimant who intends to issue proceedings shall give the defendant's insurer not less than fourteen days' written notice of that intention.</p>
<p>(2) This section is invented for tests and has no legal effect.</p>
