  <div class="v-state" id="vState">Tap to talk</div>
  <button class="v-orb" id="vOrb" aria-label="Talk"><span class="v-ring"></span><span class="v-ring"></span><canvas id="vCanvas"></canvas></button>
  <div class="v-cap" id="vCap" aria-live="polite">
    <div class="cap-user" id="capUser"><span class="settled"></span><span class="live"></span><span class="caret" aria-hidden="true"></span></div>
    <ol class="cap-list" id="capList"></ol>
    <div class="cap-cue" id="capCue"></div>
    <div class="chips cap-follow" id="capFollow"></div>
  </div>
  <ol class="v-strip" id="vStrip" aria-label="Recent exchanges"></ol>
  <div class="v-ctl">
    <button class="round" id="vSpeak" title="Speak replies aloud" aria-label="Speak replies aloud"><svg class="i"><use href="#volume"/></svg></button>
    <button class="round" id="vHands" title="Hands-free: listen again after each reply" aria-label="Hands-free"><svg class="i"><use href="#loop"/></svg></button>
    <button class="round v-end" id="vEnd" aria-label="End voice"><svg class="i"><use href="#x"/></svg></button>
  </div>
  <div class="v-opt"><span id="vHint">Space to talk · Esc to close</span><select id="voiceSel" aria-label="Voice"></select><span id="vNoVoice" class="gone">Browser voice unavailable</span></div>
</div>

<div class="lock" id="lock" role="dialog" aria-modal="true" aria-label="Boss Hub is locked">
  <div class="orb"><i></i><i></i><i></i></div>
  <h2>Boss Hub</h2>
  <div class="lsub" id="lockSub">Enter your PIN</div>
  <div class="pins" id="pins" aria-label="PIN"></div>
  <div class="lmsg" id="lockMsg" aria-live="polite"></div>
  <div class="pad" id="pad">
    <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
    <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
    <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
    <button type="button" class="del" data-key="del" aria-label="Delete"><svg class="i"><use href="#back"/></svg></button><button type="button" data-key="0">0</button><button type="button" class="ok" data-key="ok" aria-label="Unlock"><svg class="i"><use href="#check"/></svg></button>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<audio id="ttsAudio" preload="auto" playsinline></audio>
<input type="checkbox" switch id="haptic" tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="loop" viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
  <symbol id="t-today" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.2V20h13v-9.8"/><path d="M10 20v-5.5h4V20"/></symbol>
  <symbol id="t-approvals" viewBox="0 0 24 24"><path d="M4 13h4.5l1.5 3h4l1.5-3H20"/><path d="M4 13v5a1.5 1.5 0 0 0 1.5 1.5h13A1.5 1.5 0 0 0 20 18v-5l-2.6-7.5H6.6z"/></symbol>
  <symbol id="t-logic" viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3"/><path d="M8.3 14.6a6 6 0 1 1 7.4 0c-.9.7-1.3 1.6-1.4 2.6H9.7c-.1-1-.5-1.9-1.4-2.6z"/></symbol>
  <symbol id="t-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.6-5 5.5-5s4.9 1.7 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.6 14.2c2.6.2 4.2 1.7 4.9 4.8"/></symbol>
  <symbol id="t-files" viewBox="0 0 24 24"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4.2l2 2.2H19a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18z"/></symbol>
  <symbol id="share" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v8.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V11"/></symbol>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="back" viewBox="0 0 24 24"><path d="M9 5h11a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 20 19H9l-6-7z"/><path d="m12 9.5 5 5M17 9.5l-5 5"/></symbol>
</svg>

<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic=(n,cls="")=>`<svg class="i ${cls}"><use href="#${n}"/></svg>`;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const first=n=>String(n||"").split(" ")[0];
const label=f=>String(f||"").split("/").pop();
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const hoverOK=matchMedia("(hover: hover) and (pointer: fine)").matches;
const SPRING="cubic-bezier(.34,1.45,.64,1)";
/* platform: the phone layer is narrow screens, or a touch device on its side (iPhone landscape). iPad keeps the desktop chrome. */
const PHONE_MQ="(max-width:760px),((pointer:coarse) and (max-height:500px))";
const coarse=matchMedia("(pointer:coarse)").matches;
let PH=matchMedia(PHONE_MQ).matches;
const standalone=()=>navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
const iOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const iOSSafari=iOS&&/Safari\//.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo/.test(navigator.userAgent);
const secure=window.isSecureContext!==false;
function jumpTop(){ if(PH){ $("#main").scrollTop=0; return; } const hs=document.documentElement.style; hs.scrollBehavior="auto"; scrollTo(0,0); hs.scrollBehavior=""; }
function setThemeMeta(){ const dark=theme()==="dark"; document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.content=dark?"#0A0B10":"#F3F2EF"); }
/* iOS 18+ plays the system haptic when a switch control toggles inside a gesture; elsewhere this is a no-op */
function haptic(){ try{ const sw=$("#haptic"); if(sw) sw.click(); }catch{} }
/* chrome placement: on phone the tab bar leaves the top bar (it is fixed to the bottom) and the assistant orb docks in the top bar */
function placeChrome(){ const tabs=$("#tabs"), fab=$("#fab"), bar=$("#bar"); if(!tabs||!fab) return;
  if(PH){ if(tabs.parentElement!==$("#stage")) $("#stage").appendChild(tabs); if(fab.parentElement!==$(".bar-r")) $(".bar-r").prepend(fab); }
  else { if(tabs.parentElement!==bar) bar.insertBefore(tabs,$(".bar-r")); if(fab.parentElement!==document.body) document.body.insertBefore(fab,$("#scrim")); } }
function ago(ts){if(!ts)return"";const s=(Date.now()-new Date(ts))/1e3;if(s<50)return"now";if(s<3600)return Math.round(s/60)+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d"}
function agoText(ts){const a=ago(ts);return a==="now"?"just now":a?a+" ago":""}
function plural(n,w){return `${n} ${w}${n===1?"":"s"}`}
async function api(path,body,method){
  let r; try{ r=await fetch(path,{method:method||(body?"POST":"GET"),headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined}); }catch(e){ const err=new Error("Can't reach the hub right now"); err.network=true; throw err; }
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&j.error==="locked"){ showLock(j.pin!==false); const e=new Error("locked"); e.locked=true; throw e; }
  if(!r.ok) throw new Error(j.error||j.message||`Request failed (${r.status})`); return j;
}
/* toasts rise from the bottom; phones stack two, the desktop keeps one at a time */
function toast(t,ok){
  const box=$("#toasts"), max=PH?2:1, el=document.createElement("div"); el.className="toast"; el.innerHTML=(ok?ic("check"):"")+h(t);
  box.querySelectorAll(".toast").forEach(x=>x.removeAttribute("id")); el.id="toast";
  const live=[...box.children].filter(c=>!c._gone); while(live.length>=max) dropToast(live.shift());
  box.appendChild(el); requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
  el._t=setTimeout(()=>dropToast(el),2800);
}
function dropToast(el){ if(!el||el._gone) return; el._gone=true; clearTimeout(el._t); el.classList.add("out"); el.classList.remove("on"); setTimeout(()=>el.remove(),reduced?0:320); }

/* ============ state ============ */
let S=null, view=ls.get("hub.view","today"), selDraft=null, fileQ="", fileF="all", sheetFor=null, openTask=null;
const TABS=[["today","Today"],["approvals","Approvals"],["logic","Logic"],["team","Team"],["files","Files"]];
const emp=id=>S?.employees.find(e=>e.id===id||e.name===id||first(e.name)===id)||{id,name:id||"System",hue:220,enabled:1,title:""};
const who=id=>id==="director"?{name:S?.director||"You",hue:28,enabled:1}:emp(id);

function avatar(e,size=36,dot=true){
  const w=(e.name||"?").trim().split(/\s+/), ini=w.length>1?(w[0][0]+w[1][0]).toUpperCase():w[0].slice(0,1).toUpperCase()+w[0].slice(1,2);
  const hue=e.hue??220;
  return `<span class="av ${e.busy&&e.enabled?"busy":""}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px;background:linear-gradient(140deg,hsl(${hue} 80% 68%),hsl(${(hue+28)%360} 65% 42%))">${h(ini)}${dot?`<span class="dot ${e.enabled?"on":""}"></span>`:""}</span>`;
}
function spark(vals,w=96,ht=34){
  const max=Math.max(1,...vals),st=w/(vals.length-1),p=vals.map((v,i)=>[i*st,ht-2-(v/max)*(ht-6)]);
  let d=`M${p[0][0]} ${p[0][1]}`; for(let i=1;i<p.length;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],cx=(x0+x1)/2; d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}
  return `<svg class="spark" width="${w}" height="${ht}" aria-hidden="true"><defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${ht} L0 ${ht}Z" fill="url(#spg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}
const fileState=c=>S.drafts.some(d=>d.folder===c.folder)?["draft","Draft waiting"]:(c.last_outbound_at&&(!c.last_inbound_at||c.last_outbound_at>c.last_inbound_at))?["wait","Waiting on them"]:c.last_inbound_at?["owe","We owe a reply"]:["","New"];
const cnt=(k,v,cls="")=>`<b class="cnt num ${cls}" data-k="${k}" data-v="${v}">${v}</b>`;
const dateLine=()=>new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

/* ============ chrome ============ */
function renderBar(){
  const n=S.kpis.awaiting, dn=S.decisions_open||0, tabs=$("#tabs");
  const badge=id=>id==="approvals"&&n?`<span class="count num">${n}</span>`:id==="logic"&&dn?`<span class="count num warn">${dn}</span>`:"";
  if(!tabs.children.length) tabs.innerHTML=`<span class="tab-ind" id="ind"></span>`+TABS.map(([id,l])=>`<button class="tab" data-view="${id}" aria-label="${l}"><svg class="i ti" aria-hidden="true"><use href="#t-${id}"/></svg><span>${l}</span><span class="bd"></span></button>`).join("");
  $$("#tabs .tab").forEach(b=>{ b.classList.toggle("on",b.dataset.view===view); const bd=b.querySelector(".bd"), want=badge(b.dataset.view); if(bd.dataset.v!==want){bd.innerHTML=want;bd.dataset.v=want} });
  requestAnimationFrame(moveInd);
  const live=offline?["red","Offline"]:S.demo?["amber","Demo"]:S.mailbox_ready&&S.ai_ready?["","Live"]:["amber","Setup needed"];
  $("#status").classList.toggle("off",offline); $("#status").title=offline?"The hub is not answering; retrying every few seconds":"";
  $("#status").innerHTML=`<span class="pulse ${live[0]}"></span><span class="lbl">${live[1]}${S.last_pass&&!S.demo&&!offline?` · scanned ${ago(S.last_pass)} ago`:""}</span>`;
  $("#themeBtn").innerHTML=ic(theme()==="dark"?"sun":"moon"); $("#themeBtn").setAttribute("aria-label",theme()==="dark"?"Switch to light mode":"Switch to dark mode");
}
/* the pill indicator morphs: it first stretches to cover both tabs, then settles on the new one */
let indPrev=null;
function moveInd(){
  const on=$(".tab.on"),ind=$("#ind"); if(!on||!ind)return; const L=on.offsetLeft,W=on.offsetWidth;
  if(PH){ ind.style.left="0px"; ind.style.width=W+"px"; ind.style.transform=`translateX(${L}px)`; indPrev={L,W}; return; }
  ind.style.transform="";
  if(indPrev&&!reduced&&indPrev.L!==L){
    const l=Math.min(L,indPrev.L), w=Math.max(L+W,indPrev.L+indPrev.W)-l;
    ind.classList.add("stretch"); ind.style.left=l+"px"; ind.style.width=w+"px";
    clearTimeout(ind._t); ind._t=setTimeout(()=>{ ind.classList.remove("stretch"); ind.style.left=L+"px"; ind.style.width=W+"px"; },170);
  } else { ind.style.left=L+"px"; ind.style.width=W+"px"; }
  indPrev={L,W};
}
/* the top bar: frosted once scrolled; on phone it hides on scroll-down and comes back on scroll-up (transform only) */
let lastSY=0, barHidden=false;
function onScroll(){
  const y=PH?$("#main").scrollTop:scrollY, bar=$("#bar"); bar.classList.toggle("scrolled",y>4);
  if(!PH){ if(barHidden){barHidden=false;bar.classList.remove("hide")} return; }
  const dy=y-lastSY; lastSY=y;
  if(view==="files"||sheetFor){ if(barHidden){barHidden=false;bar.classList.remove("hide")} return; }
  if(dy>6&&y>90&&!barHidden){ barHidden=true; bar.classList.add("hide"); }
  else if((dy<-6||y<=40)&&barHidden){ barHidden=false; bar.classList.remove("hide"); }
}
addEventListener("scroll",onScroll,{passive:true}); $("#main").addEventListener("scroll",onScroll,{passive:true});
/* resize / rotation: re-place the chrome and re-render when the phone/desktop decision flips */
let rzT=0;
function onResize(){ indPrev=null; moveInd(); clearTimeout(rzT); rzT=setTimeout(()=>{ const ph=matchMedia(PHONE_MQ).matches; orbs.forEach(o=>o.rect=null); if(ph!==PH){ PH=ph; placeChrome(); if(S) render(false); } moveInd(); },150); }
addEventListener("resize",onResize); addEventListener("orientationchange",onResize);
/* the software keyboard only shrinks the visual viewport on iOS: --kb lifts sheets, modals and toasts above it */
function vvUpdate(){ if(!coarse||!window.visualViewport) return; const vv=visualViewport, kb=Math.max(0,Math.round(innerHeight-vv.height-vv.offsetTop)), root=document.documentElement;
  root.style.setProperty("--kb",kb+"px"); const open=kb>60; if(root.classList.contains("kb-open")!==open){ root.classList.toggle("kb-open",open); if(open&&sheetFor?.kind==="chat"){ const b=$("#chatBody"); if(b) setTimeout(()=>b.scrollTop=b.scrollHeight,50); } } }
if(window.visualViewport){ visualViewport.addEventListener("resize",vvUpdate); visualViewport.addEventListener("scroll",vvUpdate); }
function theme(){return document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}

/* ============ Today ============ */
function greet(){const hr=new Date().getHours();return hr<12?"Good morning":hr<18?"Good afternoon":"Good evening"}
function nowLine(){
  const a=S.activity[0]; if(!a) return {who:"Team",txt:"Standing by."};
  const e=who(a.employee); return {who:first(e.name),txt:a.text,ts:a.ts};
}
function deck(){
  const k=S.kpis, nl=nowLine(), on=S.employees.filter(e=>e.enabled).length;
  return `<section class="deck rv" id="deck" aria-label="${h(S.assistant)}">
    <div class="bgl a"></div><div class="bgl g"></div><div class="bgl h"></div><div class="bgl v"></div>
    <span class="brk tl"></span><span class="brk tr"></span><span class="brk bl"></span><span class="brk br"></span>
    <div class="hud"><span class="live"></span><span>${h(S.assistant)}</span><span class="sep"></span><span id="deckState">online</span><span class="sp"></span><span class="date">${dateLine()}</span><span class="sep date"></span><span>${on}/${S.employees.length} staff on</span></div>
    <div class="stage">
      <div class="deck-orb" id="deckOrb" title="Talk to ${h(S.assistant)}" role="button" tabindex="0" aria-label="Talk to ${h(S.assistant)}"><span class="halo"></span><span class="ring"></span><span class="ring r2"></span><canvas id="deckCanvas"></canvas></div>
      <div class="deck-say" id="deckSay">${h(greetingText||"")}${greetingText?"":'<span class="cur"></span>'}</div>
      <div class="deck-now"><span class="who">${h(nl.who)}</span><span class="txt">${h(nl.txt)}</span><span class="k">${agoText(nl.ts)}</span></div>
      <div class="deck-act">
        <button class="btn glow" id="askMic">${ic("mic")}Talk</button>
        <button class="btn" data-ask-voice="Brief me: what needs my decision, what is moving, and any risks.">${ic("volume")}Brief me</button>
        <button class="btn" id="replayBtn" title="Hear the greeting again">${ic("loop")}Again</button>
        ${S.decisions_open?`<button class="btn" data-view="logic">${ic("flag")}${plural(S.decisions_open,"decision")} waiting</button>`:""}
      </div>
    </div>
    <div class="readout" aria-label="Readout">
      <div>${cnt("d-aw",k.awaiting,k.awaiting?"hl":"")}Awaiting you</div>
      <div>${cnt("d-de",S.decisions_open||0,S.decisions_open?"warn":"")}Decisions</div>
      <div>${cnt("d-ov",k.overdue,k.overdue?"warn":"")}Waiting on them</div>
      <div>${cnt("d-se",k.sent_week)}Sent this week</div>
    </div></section>`;
}
function vToday(){
  const k=S.kpis, running=S.tasks.filter(t=>t.status==="running"||t.status==="queued");
  return `<div class="view">
  <div class="rv">
    <div class="eyebrow">${dateLine()}</div>
    <h1>${greet()}, <em>${h(S.director)}</em></h1>
    ${banner()}
  </div>
  ${a2hsHint()}
  ${deck()}
  <div class="rv">
  <form class="ask" id="askForm" autocomplete="off">
    <div class="orb"><i></i><i></i><i></i></div>
    <input id="askIn" placeholder="${PH?`Ask ${h(S.assistant)} anything`:`Ask ${h(S.assistant)} anything, or tell the team what to do`}" aria-label="Ask your assistant" autocomplete="off" autocorrect="off" enterkeyhint="send">
    <kbd>⌘K</kbd>
    <button type="button" class="ask-mic" data-mic aria-label="Talk to ${h(S.assistant)}">${ic("mic")}</button>
  </form>
  <div class="chips ${S.ai_ready===false?"dim":""}">${["Brief me","What needs my approval?","Which files are overdue?","Switch Harry off"].map(c=>`<button class="chip" data-ask="${h(c)}">${h(c)}</button>`).join("")}</div>

  if(!S)return; renderBar();

function stagger(root){ let i=0; root.querySelectorAll(".rv").forEach(s=>{ s.style.setProperty("--i",Math.min(i++,14)); let j=0; s.querySelectorAll(".ri").forEach(e=>e.style.setProperty("--j",Math.min(j++,12))); }); }
const lastVals={};
function countUps(root){
  root.querySelectorAll(".cnt").forEach(el=>{
    const k=el.dataset.k, to=+el.dataset.v||0, from=lastVals[k]??0; lastVals[k]=to;
    if(reduced||from===to){ el.textContent=to; return; }
    const t0=performance.now(), dur=900+Math.min(600,Math.abs(to-from)*40);
    const step=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4); el.textContent=Math.round(from+(to-from)*e); if(p<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
let lastKey="";
let lockedUntil=0, pollFails=0, offline=false;
const NOISE=/^(Voice failed|Task \d+ failed|Traceback|Error:|WARNING)/i;   /* plumbing warnings are never staff activity */
async function refresh(force){
  if(locked&&!force&&Date.now()<lockedUntil) return;   /* while the lock screen is up, poll gently */
  try{const n=await api("/api/state");try{n.reports=await api("/api/reports")}catch(e){n.reports=[]; if(e.locked) throw e;}
    pollFails=0; if(offline){ offline=false; toast("Back online",1); if(S) renderBar(); }
    if(locked) hideLock();
    n.activity=(n.activity||[]).filter(a=>!NOISE.test(a.text||"")); (n.employees||[]).forEach(e=>{ if(e.last&&NOISE.test(e.last.text||"")) e.last=null; });
    const key=JSON.stringify(n); if(!force&&key===lastKey)return;
    const typing=!force&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    noteChanges(n); S=n; lastKey=key; if(typing){renderBar();return} render(!$("#main .view"));
  }catch(e){ if(e&&e.locked){ lockedUntil=Date.now()+15000; return; } if(++pollFails>=2&&!offline){ offline=true; if(S) renderBar(); toast("Can't reach the hub, retrying"); } console.warn(e) }
}

/* bottom sheets (phone): drag down to dismiss. The sheet follows the finger with rubber-band damping; past a quarter of its height, or a quick flick, it goes; otherwise it springs back. Scrolling inside only turns into a drag at the top of the content. */
function attachDrag(el,getScroller,onDismiss){
  let y0=0,x0=0,dy=0,lastY=0,lastT=0,vy=0,active=false,drag=false,decided=false,sc=null;
  el.addEventListener("touchstart",e=>{ if(!PH||!el.classList.contains("on")||e.touches.length!==1){active=false;return} const t=e.touches[0]; y0=lastY=t.clientY; x0=t.clientX; lastT=e.timeStamp; dy=0; vy=0; active=true; drag=false; decided=false; sc=getScroller(e.target); },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!active) return; const t=e.touches[0], d=t.clientY-y0;
    if(!decided){ decided=true; const ax=Math.abs(t.clientX-x0); if(!(d>0&&d>=ax&&(!sc||sc.scrollTop<=0))){ active=false; return; } drag=true; el.classList.add("dragging"); }
    if(!drag) return; if(e.cancelable) e.preventDefault();
    dy=Math.max(0,d); const H=el.offsetHeight||1, pos=H*(1-Math.exp(-1.15*dy/H));
    el.style.transform=`translateY(${pos.toFixed(1)}px)`; $("#scrim").style.opacity=String(Math.max(.12,1-pos/H).toFixed(3));
    const dt=e.timeStamp-lastT; if(dt>0) vy=vy*.4+((t.clientY-lastY)/dt)*.6; lastY=t.clientY; lastT=e.timeStamp;
  },{passive:false});
  const end=()=>{ if(!active) return; active=false; if(!drag) return; drag=false; const H=el.offsetHeight||1, far=dy>H*.25||vy>.6;
    el.classList.remove("dragging"); el.style.transform=""; $("#scrim").style.opacity=""; if(far){ haptic(); onDismiss(); } };
  el.addEventListener("touchend",end); el.addEventListener("touchcancel",end);
}

  const back=()=>{ c.remove(); btn.classList.remove("gone"); };
  c.querySelector("[data-yes]").onclick=async ev=>{ ev.stopPropagation(); back(); try{ await onYes(); }catch(e){ toast(e.message); } };

}
function shakePins(){ const p=$("#pins"); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake"); setTimeout(()=>p.classList.remove("shake"),520); }
function lockCountdown(sec){ lockWait=Date.now()+sec*1000; $("#pad").setAttribute("aria-disabled","true"); clearInterval(lockTick);
  const tick=()=>{ const left=Math.max(0,Math.ceil((lockWait-Date.now())/1000)); lockMsg(left?`Too many attempts. Try again in ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`:"",!!left); if(!left){ clearInterval(lockTick); $("#pad").removeAttribute("aria-disabled"); } };
  tick(); lockTick=setInterval(tick,1000); }
$("#pad").addEventListener("click",ev=>{ const b=ev.target.closest("[data-key]"); if(b) lockKey(b.dataset.key); });

/* ============ boot ============ */
(()=>{const t=ls.get("hub.theme",null); if(t) document.documentElement.dataset.theme=t; if(coarse||navigator.maxTouchPoints>0) document.documentElement.classList.add("touch"); if(!TABS.some(x=>x[0]===view)) view="today"; setThemeMeta(); placeChrome(); vvUpdate(); $("#vHint").textContent=coarse?"Tap the orb to talk":"Space to talk · Esc to close";
  try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(S) renderBar(); setThemeMeta(); }); }catch{} })();
refresh(true).then(loadGreeting); setInterval(()=>refresh(false),5000); setInterval(()=>{ if(S) renderBar(); },30000);
setInterval(()=>{ if(view==="today"&&!document.querySelector("input:focus,textarea:focus")) loadGreetingQuiet(); },20*60*1000);
async function loadGreetingQuiet(){ try{ const g=await api("/api/greeting"); if(g.text!==greetingText){ greetingText=g.text; const el=$("#deckSay"); if(el) el.textContent=g.text; } }catch{} }
</script>
