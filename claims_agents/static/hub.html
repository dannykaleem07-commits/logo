<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boss Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --sunk:#F4F4F2; --hover:#F1F1EF;
  --ink:#0C0C0E; --ink2:#55565C; --ink3:#9A9BA1;
  --hair:rgba(12,12,14,.07); --hair2:rgba(12,12,14,.11);
  --accent:#2563EB; --accent-soft:rgba(37,99,235,.09); --on-accent:#fff;
  --green:#16A34A; --amber:#D97706; --red:#DC2626;
  --glow:rgba(37,99,235,.10);
  --shadow:0 1px 1px rgba(12,12,14,.03),0 2px 6px rgba(12,12,14,.04);
  --lift:0 1px 2px rgba(12,12,14,.04),0 12px 32px -8px rgba(12,12,14,.12);
  --float:0 24px 80px -16px rgba(12,12,14,.28),0 4px 12px rgba(12,12,14,.06);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",ui-serif,Georgia,serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09090B; --surface:#111113; --sunk:#0D0D0F; --hover:#18181B;
  --ink:#F4F4F5; --ink2:#A1A1AA; --ink3:#63636B;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.11);
  --accent:#5B8CFF; --accent-soft:rgba(91,140,255,.12); --on-accent:#05091A;
  --green:#3DD68C; --amber:#F5A524; --red:#F87171; --glow:rgba(91,140,255,.10);
  --shadow:0 0 0 1px rgba(255,255,255,.02); --lift:0 16px 40px -10px rgba(0,0,0,.6);
  --float:0 30px 90px -10px rgba(0,0,0,.75); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090B; --surface:#111113; --sunk:#0D0D0F; --hover:#18181B;
  --ink:#F4F4F5; --ink2:#A1A1AA; --ink3:#63636B;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.11);
  --accent:#5B8CFF; --accent-soft:rgba(91,140,255,.12); --on-accent:#05091A;
  --green:#3DD68C; --amber:#F5A524; --red:#F87171; --glow:rgba(91,140,255,.10);
  --shadow:0 0 0 1px rgba(255,255,255,.02); --lift:0 16px 40px -10px rgba(0,0,0,.6);
  --float:0 30px 90px -10px rgba(0,0,0,.75); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;min-height:100vh}
body::before{content:"";position:fixed;inset:-20vh -10vw auto;height:70vh;background:radial-gradient(50% 60% at 50% 0%,var(--glow),transparent 70%);pointer-events:none;z-index:0}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink3)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--hair)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em}
.logo-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;font-weight:600;letter-spacing:-.02em}
.tabs{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--sunk);border:1px solid var(--hair);position:relative}
.tab{position:relative;z-index:1;height:32px;padding:0 16px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:7px;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab-ind{position:absolute;top:4px;height:32px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--hair);transition:left .35s var(--ease),width .35s var(--ease)}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.bar-r{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.status{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);font-size:12.5px;color:var(--ink2);background:var(--surface)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2s var(--ease) infinite}
.pulse.amber{background:var(--amber)}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.6);opacity:0}}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--ink)}

/* ---------- page ---------- */
main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:40px 28px 140px}
.view{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;color:var(--ink3);font-weight:500;margin-bottom:10px}
h1{font-size:46px;line-height:1.04;font-weight:600;letter-spacing:-.035em;margin:0}
h1 em{font-family:var(--serif);font-weight:400;font-size:1.12em;letter-spacing:-.01em}
.lede{font-size:17px;color:var(--ink2);margin:14px 0 0;max-width:640px;line-height:1.55}
.lede b{color:var(--ink);font-weight:500}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-h h1{font-size:34px}
.page-h .lede{font-size:15px;margin-top:8px}
.page-h .act{margin-left:auto;display:flex;gap:8px}
.section-t{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:500;color:var(--ink2);margin:0 4px 12px}
.section-t a,.link{color:var(--ink3);text-decoration:none;font-weight:500;font-size:13px;transition:color .15s;cursor:pointer}
.section-t a:hover,.link:hover{color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow)}
.btn{height:36px;padding:0 14px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13.5px;border:1px solid var(--hair2);background:var(--surface);transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px -6px var(--accent)}
.btn.accent:hover{filter:brightness(1.06);background:var(--accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
kbd{font:500 11px var(--sans);padding:2px 6px;border-radius:6px;border:1px solid var(--hair2);color:var(--ink3);background:var(--sunk)}

/* ---------- command bar ---------- */
.ask{margin:34px 0 14px;display:flex;align-items:center;gap:14px;height:64px;padding:0 10px 0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--hair2);box-shadow:var(--lift);transition:box-shadow .25s,border-color .25s}
.ask:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:var(--lift),0 0 0 5px var(--accent-soft)}
.ask input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.ask input::placeholder{color:var(--ink3)}
.ask .orb{width:42px;height:42px}
.ask-mic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);transition:transform .15s}
.ask-mic:hover{transform:scale(1.05)}
.ask-mic svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 44px 8px}
.chip{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--hair2);background:color-mix(in srgb,var(--surface) 70%,transparent);font-size:13px;color:var(--ink2);transition:all .15s}
.chip:hover{color:var(--ink);border-color:var(--ink3)}

/* ---------- orb ---------- */
.orb{position:relative;border-radius:50%;flex:none;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 32% 28%,#EAF2FF 0,#9DBDFF 16%,#4B7BFF 42%,#2A4BD8 66%,#121E5C 100%);
  box-shadow:inset 0 -6px 14px rgba(8,16,60,.45),inset 0 4px 10px rgba(255,255,255,.35)}
.orb i{position:absolute;border-radius:50%;filter:blur(6px);mix-blend-mode:screen;opacity:.85}
.orb i:nth-child(1){width:70%;height:70%;left:-10%;top:30%;background:#5EEAD4;animation:drift 9s ease-in-out infinite}
.orb i:nth-child(2){width:60%;height:60%;right:-12%;top:-8%;background:#A78BFA;animation:drift 11s ease-in-out infinite reverse}
.orb i:nth-child(3){width:45%;height:45%;left:30%;bottom:-15%;background:#60A5FA;animation:drift 7s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(18%,-12%) scale(1.15)}66%{transform:translate(-12%,10%) scale(.9)}}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.75),transparent 28%)}
.orb canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.orb.live{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}

/* ---------- today ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid>*{min-width:0}
.stack{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.stack>*,section{min-width:0}
html{overflow-x:clip}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
.metric{padding:20px 22px;position:relative}
.metric+.metric{border-left:1px solid var(--hair)}
.metric .v{font-size:34px;font-weight:500;letter-spacing:-.04em;line-height:1.1}
.metric .l{font-size:13px;color:var(--ink3);margin-top:4px}
.metric.hl .v{color:var(--accent)}
.metric.warn .v{color:var(--amber)}
.metric svg.spark{position:absolute;right:20px;top:24px}
.list{padding:6px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;transition:background .15s;cursor:pointer;text-align:left;width:100%}
.item:hover{background:var(--hover)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{font-size:12.5px;color:var(--ink3);flex:none}
.item.sel{background:var(--accent-soft)}
.empty{padding:36px 20px;text-align:center;color:var(--ink3);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:15px;margin-bottom:2px}
.timeline{padding:18px 22px 10px;position:relative}
.tl{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;padding-bottom:16px;font-size:13.5px;position:relative}
.tl .when{color:var(--ink3);font-size:12px;text-align:right;padding-top:1px}
.tl .node{position:relative}
.tl .node::before{content:"";position:absolute;left:6px;top:14px;bottom:-16px;width:1px;background:var(--hair2)}
.tl:last-child .node::before{display:none}
.tl .node span{position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--hair2)}
.tl .txt{color:var(--ink2);min-width:0;overflow-wrap:anywhere}
.tl .txt b{color:var(--ink);font-weight:500}

/* ---------- avatars, people ---------- */
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:-.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 6px rgba(0,0,0,.18)}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;border:2px solid var(--surface);background:var(--ink3)}
.av .dot.on{background:var(--green)}
.av.busy::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--green);animation:halo 2s var(--ease) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.2)}}
.person{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;transition:background .15s}
.person:hover{background:var(--hover)}
.person .main{flex:1;min-width:0;cursor:pointer}
.person .t{font-weight:500}
.person .s{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{padding:22px;display:flex;flex-direction:column;gap:18px;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease),opacity .2s;text-align:left;min-height:200px}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--lift)}
.pcard.off{opacity:.55}
.pcard .top{display:flex;align-items:flex-start;gap:14px}
.pcard .nm{font-size:16px;font-weight:600;letter-spacing:-.02em}
.pcard .ti{font-size:13px;color:var(--ink3)}
.pcard .now{font-size:13.5px;color:var(--ink2);line-height:1.5;flex:1}
.pcard .meta{display:flex;gap:16px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--hair);padding-top:14px}
.pcard .meta b{color:var(--ink);font-weight:500}
.hire{border:1px dashed var(--hair2);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--ink3);gap:10px}
.hire:hover{color:var(--ink);border-color:var(--ink3);box-shadow:none}
.hire .plus{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair2);display:grid;place-items:center}

/* switch */
.sw{position:relative;width:38px;height:22px;flex:none;margin-left:auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--hair2);transition:background .25s var(--ease)}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.08);transition:transform .3s var(--ease)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- approvals ---------- */
.reader{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.reader>*{min-width:0}
.queue{padding:6px;position:sticky;top:84px}
.paper{overflow:hidden}
.paper-h{padding:26px 32px 0}
.by{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
.by b{color:var(--ink);font-weight:500}
.subj{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.3;margin:16px 0 12px}
.to{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink3)}
.tag{height:24px;padding:0 9px;border-radius:7px;background:var(--sunk);border:1px solid var(--hair);color:var(--ink2);font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.note{margin:18px 32px 0;padding:12px 14px;border-radius:12px;background:var(--sunk);border:1px solid var(--hair);font-size:13px;color:var(--ink2);display:flex;gap:10px}
.note svg{color:var(--ink3);margin-top:2px}
.letter{padding:26px 32px 30px;font-size:15px;line-height:1.7;color:var(--ink)}
.letter p{margin:0 0 14px}
.letter ul,.letter ol{margin:0 0 14px;padding-left:20px}
.letter strong{font-weight:600}
.extras{font-size:12.5px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;padding-top:6px}
.decide{display:flex;gap:10px;align-items:center;padding:16px 20px 16px 32px;border-top:1px solid var(--hair);background:color-mix(in srgb,var(--sunk) 60%,var(--surface))}
.decide .hint{font-size:12.5px;color:var(--ink3);display:flex;gap:6px;align-items:center}

/* ---------- files ---------- */
.search{position:relative}
.search input{height:36px;width:260px;border-radius:10px;border:1px solid var(--hair2);background:var(--surface);padding:0 12px 0 34px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:10px;color:var(--ink3)}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--sunk);border:1px solid var(--hair)}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:13px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--hair)}
.frow{display:grid;grid-template-columns:minmax(0,1.1fr) 150px minmax(0,2fr) 90px 80px;gap:18px;align-items:center;padding:16px 22px;border-top:1px solid var(--hair);cursor:pointer;transition:background .15s}
.frow:first-child{border-top:0;border-radius:20px 20px 0 0}
.frow:last-child{border-radius:0 0 20px 20px}
.frow:hover{background:var(--hover)}
.frow .c b{display:block;font-weight:500}
.frow .c span,.frow .w{font-size:12.5px;color:var(--ink3)}
.frow .sum{font-size:13.5px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.state{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap}
.state i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.state.owe i{background:var(--red)}.state.wait i{background:var(--amber)}.state.draft i{background:var(--accent)}
.ladder{display:flex;gap:3px}
.ladder i{width:12px;height:4px;border-radius:2px;background:var(--hair2)}
.ladder i.on{background:var(--amber)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(9,9,11,.32);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;top:10px;right:10px;bottom:10px;width:min(480px,calc(100vw - 20px));background:var(--surface);border:1px solid var(--hair);border-radius:24px;box-shadow:var(--float);display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .45s var(--ease)}
.sheet.on{transform:none}
.sheet.wide{width:min(860px,calc(100vw - 20px))}
.sheet-h{display:flex;align-items:center;gap:14px;padding:20px 22px;border-bottom:1px solid var(--hair)}
.sheet-h .t{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheet-h .s{font-size:13px;color:var(--ink3)}
.sheet-b{flex:1;overflow:auto;padding:22px}
.blk{margin-bottom:26px}
.blk>h4{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink2)}
.in{width:100%;border:1px solid var(--hair2);background:var(--surface);border-radius:11px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.in{min-height:92px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{padding:14px 0;border-top:1px solid var(--hair)}
.task:first-child{border-top:0;padding-top:0}
.task .t{font-weight:500;display:flex;gap:10px;align-items:baseline}
.task .t span{margin-left:auto}
.task .s{font-size:13px;color:var(--ink2);margin-top:4px}
.badge{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--ink2);border:1px solid var(--hair);white-space:nowrap}
.badge.done{color:var(--green)}.badge.running{color:var(--accent)}.badge.failed{color:var(--red)}
.result{margin-top:10px;padding:14px;border-radius:12px;background:var(--sunk);font-size:13.5px;line-height:1.6;border:1px solid var(--hair)}
.result h3{font-size:14px;margin:6px 0}
.result table{border-collapse:collapse}.result td,.result th{border:1px solid var(--hair2);padding:4px 8px}
.helpers{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.hues{display:flex;gap:10px}
.hues button{width:28px;height:28px;border-radius:50%;transition:transform .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.hues button.sel{outline:2px solid var(--ink);outline-offset:3px}
iframe.rep{width:100%;flex:1;border:0;border-radius:0 0 24px 24px;background:#fff}
.modal{position:fixed;z-index:62;left:50%;top:50%;width:min(520px,calc(100vw - 32px));max-height:88vh;overflow:auto;transform:translate(-50%,-48%) scale(.98);opacity:0;pointer-events:none;background:var(--surface);border:1px solid var(--hair);border-radius:24px;box-shadow:var(--float);padding:26px;transition:all .3s var(--ease)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal h3{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:600}
.modal .sub{color:var(--ink3);margin:6px 0 20px;font-size:14px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ---------- assistant ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:50;width:56px;height:56px;border-radius:50%;box-shadow:0 12px 30px -6px rgba(37,99,235,.55);transition:transform .3s var(--ease),opacity .3s}
.fab:hover{transform:scale(1.06)}
.fab .orb{width:100%;height:100%}
.fab.hidden{opacity:0;transform:scale(.6);pointer-events:none}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:86%;font-size:14.5px;line-height:1.6;animation:enter .3s var(--ease) both}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:18px 18px 6px 18px;white-space:pre-wrap}
.msg.a{align-self:flex-start;color:var(--ink)}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}.msg.a ul{margin:4px 0 8px;padding-left:18px}
.done-tag{display:inline-flex;align-items:center;gap:6px;margin:8px 6px 0 0;font-size:12.5px;color:var(--green);background:color-mix(in srgb,var(--green) 10%,transparent);padding:4px 10px;border-radius:999px}
.dots{display:inline-flex;gap:4px;padding:6px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:bl 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.composer{padding:14px;border-top:1px solid var(--hair)}
.composer-in{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 14px;border-radius:18px;border:1px solid var(--hair2);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.composer-in:focus-within{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:none;padding:8px 0;max-height:140px;line-height:1.45}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform .15s,background .15s}
.round.dark{background:var(--ink);color:var(--bg)}
.round.light{color:var(--ink2)}.round.light:hover{background:var(--hover)}
.round:active{transform:scale(.94)}
.welcome{text-align:center;padding:40px 10px 10px}
.welcome .orb{width:72px;height:72px;margin:0 auto 18px}
.welcome h3{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:600}
.welcome p{color:var(--ink3);margin:6px auto 20px;max-width:300px}
.welcome .chips{justify-content:center;margin:0}

/* voice overlay */
.voice{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(30px) saturate(1.4);-webkit-backdrop-filter:blur(30px) saturate(1.4);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.voice.on{opacity:1;pointer-events:auto}
.voice .orb{width:min(240px,56vw);height:min(240px,56vw);box-shadow:0 40px 120px -20px rgba(37,99,235,.6),inset 0 -14px 30px rgba(8,16,60,.45),inset 0 8px 20px rgba(255,255,255,.35);cursor:pointer;transition:transform .5s var(--ease)}
.voice .orb i{filter:blur(16px)}
#vOrb{background:none!important;box-shadow:none!important;overflow:visible!important}
#vOrb::after{display:none}
.v-state{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.v-text{font-size:22px;line-height:1.45;letter-spacing:-.02em;text-align:center;max-width:620px;min-height:64px;color:var(--ink)}
.v-text.user{color:var(--ink2)}
.v-ctl{display:flex;gap:10px;align-items:center}
.v-ctl .round{width:48px;height:48px;border:1px solid var(--hair2);background:var(--surface)}
.v-ctl .round.on{background:var(--ink);color:var(--bg)}
.v-ctl .round svg{width:18px;height:18px}
.v-end{background:var(--red)!important;color:#fff!important;border-color:transparent!important}
.v-opt{font-size:13px;color:var(--ink3);display:flex;gap:16px;align-items:center}
.v-opt select{border:1px solid var(--hair2);border-radius:9px;background:var(--surface);padding:5px 8px;max-width:220px}

/* ---------- command deck (Jarvis) ---------- */
.deck{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 140% at 0% 0%,#0E1A3A 0,#070B16 45%,#05070C 100%);color:#DCE8F5;border:1px solid rgba(124,196,255,.14);box-shadow:0 30px 80px -30px rgba(10,30,80,.55),inset 0 1px 0 rgba(255,255,255,.05);display:grid;grid-template-columns:300px minmax(0,1fr);min-height:300px;margin-top:30px;isolation:isolate}
.deck::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(124,196,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(124,196,255,.045) 1px,transparent 1px);background-size:44px 44px;mask:radial-gradient(70% 90% at 30% 50%,#000 20%,transparent 80%);pointer-events:none}
.deck::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);opacity:.45;pointer-events:none;mix-blend-mode:multiply}
.deck .brk{position:absolute;width:14px;height:14px;border:1px solid rgba(155,216,255,.55);pointer-events:none}
.deck .brk.tl{left:14px;top:14px;border-right:0;border-bottom:0}.deck .brk.tr{right:14px;top:14px;border-left:0;border-bottom:0}
.deck .brk.bl{left:14px;bottom:14px;border-right:0;border-top:0}.deck .brk.br{right:14px;bottom:14px;border-left:0;border-top:0}
.deck-orb{position:relative;display:grid;place-items:center;cursor:pointer}
.deck-orb canvas{width:100%;height:100%;display:block}
.deck-orb .st{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(155,216,255,.6);font-weight:600}
.deck-body{position:relative;padding:34px 36px 30px 10px;display:flex;flex-direction:column;gap:18px;min-width:0}
.deck-name{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:rgba(155,216,255,.55);font-weight:600;display:flex;align-items:center;gap:10px}
.deck-name .live{width:6px;height:6px;border-radius:50%;background:#3EE0A6;box-shadow:0 0 0 0 rgba(62,224,166,.6);animation:livep 2.2s infinite}
@keyframes livep{70%{box-shadow:0 0 0 9px rgba(62,224,166,0)}100%{box-shadow:0 0 0 0 rgba(62,224,166,0)}}
.deck-say{font-family:var(--serif);font-size:30px;line-height:1.28;letter-spacing:-.01em;color:#F2F6FB;min-height:78px;text-wrap:pretty}
.deck-say .cur{display:inline-block;width:2px;height:.9em;background:#9BD8FF;vertical-align:-2px;margin-left:3px;animation:bl 1s infinite}
.deck-now{display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(220,232,245,.72);min-height:22px;overflow:hidden;white-space:nowrap}
.deck-now .who{color:#9BD8FF;font-weight:600;flex:none}
.deck-now .txt{overflow:hidden;text-overflow:ellipsis}
.deck-now .k{flex:none;margin-left:auto;font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.14em;color:rgba(155,216,255,.5);text-transform:uppercase}
.deck-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.deck .btn{background:rgba(124,196,255,.08);border-color:rgba(124,196,255,.22);color:#DCE8F5}
.deck .btn:hover{background:rgba(124,196,255,.16)}
.deck .btn.glow{background:#9BD8FF;color:#06101F;border-color:transparent;box-shadow:0 8px 24px -8px rgba(155,216,255,.8)}
.deck .btn.glow:hover{background:#B8E4FF}
.deck-read{display:grid;grid-template-columns:repeat(4,auto);gap:22px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(155,216,255,.5)}
.deck-read b{display:block;font:500 22px/1.1 var(--sans);letter-spacing:-.03em;color:#F2F6FB;margin-bottom:3px}
.deck-read b.hl{color:#9BD8FF}.deck-read b.warn{color:#FFB648}

/* ---------- logic ---------- */
.dcard{padding:24px 26px;display:grid;gap:16px;border-left:3px solid var(--amber)}
.dcard .ask-by{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
.dcard .ask-by b{color:var(--ink);font-weight:500}
.dcard .sit{font-size:17px;line-height:1.45;letter-spacing:-.015em}
.dcard .rec{padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.dcard .rec .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.dcard .opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--hair2);background:var(--surface);transition:all .15s;font-size:14px;line-height:1.45}
.opt:hover{border-color:var(--ink3)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--hair2);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink3);flex:none}
.opt.sel .n{background:var(--accent);color:var(--on-accent);border-color:transparent}
.dcard .risk{font-size:13px;color:var(--ink2)}
.dcard .risk b{color:var(--amber);font-weight:500}
.remember{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink2);cursor:pointer}
.remember input{width:16px;height:16px;accent-color:var(--accent)}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:16px 22px;border-top:1px solid var(--hair);align-items:start}
.rule:first-child{border-top:0}
.rule .w{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.rule .w+div{margin:3px 0 10px;font-weight:500}
.rule .d{color:var(--ink2);line-height:1.55}
.rule .src{font-size:11.5px;color:var(--ink3);margin-top:8px;display:flex;gap:8px;align-items:center}
.rule.off{opacity:.5}
.rule .ctl{display:flex;gap:4px;align-items:center}
.src-tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--hair2)}
.src-tag.learned{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.addrule{padding:20px 22px;display:grid;gap:10px;grid-template-columns:1fr 1fr auto;align-items:end}
.addrule .field{margin:0}
.spoken-hint{font-size:12px;color:var(--ink3);margin-top:6px}

.toast{position:fixed;left:50%;bottom:28px;z-index:90;transform:translate(-50%,16px);opacity:0;transition:all .35s var(--ease);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:500;font-size:13.5px;box-shadow:var(--float);display:flex;gap:8px;align-items:center;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{display:flex;gap:10px;align-items:center;margin-top:22px;padding:10px 14px;border-radius:12px;border:1px solid var(--hair);background:color-mix(in srgb,var(--surface) 70%,transparent);font-size:13px;color:var(--ink2);width:fit-content;max-width:100%}
.banner code{font-size:12px;background:var(--sunk);padding:1px 6px;border-radius:6px;border:1px solid var(--hair)}

@media (max-width:980px){
  .deck{grid-template-columns:minmax(0,1fr)}
  .deck-orb{height:220px}
  .deck-body{padding:0 26px 28px}
  .deck-read{grid-template-columns:repeat(2,auto)}
  .addrule{grid-template-columns:1fr}
  .grid,.reader{grid-template-columns:minmax(0,1fr)}
  .queue{position:static}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric:nth-child(3){border-left:0}
  .metric:nth-child(n+3){border-top:1px solid var(--hair)}
  .frow{grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
  .frow .sum,.frow .ld,.frow .w{display:none}
}
@media (max-width:720px){
  .bar{grid-template-columns:1fr auto;padding:12px 16px}
  .tabs{position:fixed;left:12px;right:12px;bottom:12px;justify-content:space-around;box-shadow:var(--float);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px);padding:5px}
  .tab{flex:1;justify-content:center;padding:0 6px;font-size:12.5px}
  .status .lbl{display:none}
  main{padding:26px 16px 150px}
  h1{font-size:34px}
  .lede{font-size:15.5px}
  .ask{height:58px}
  .ask kbd{display:none}
  .deck-say{font-size:24px}
  .metric svg.spark{display:none}
  .fab{bottom:84px;right:16px;width:50px;height:50px}
  .search input{width:100%}
  .page-h .act{margin-left:0;width:100%;flex-wrap:wrap}
  .people{grid-template-columns:minmax(0,1fr)}
  .row2{grid-template-columns:1fr}
  .paper-h,.letter{padding-left:20px;padding-right:20px}.note{margin-left:20px;margin-right:20px}.decide{padding-left:20px}
  .decide .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="logo"><div class="logo-mark">CC</div><span>Boss Hub</span></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="bar-r">
    <div class="status" id="status"></div>
    <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark"></button>
    <button class="icon-btn" id="setBtn" aria-label="Settings"><svg class="i"><use href="#cog"/></svg></button>
  </div>
</header>
<main id="main"></main>

<button class="fab" id="fab" aria-label="Open your assistant"><div class="orb"><i></i><i></i><i></i></div></button>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

<div class="voice" id="voice" role="dialog" aria-label="Voice assistant">
  <div class="v-state" id="vState">Tap to talk</div>
  <button class="orb" id="vOrb" aria-label="Talk" style="background:transparent;box-shadow:none;overflow:visible"><canvas id="vCanvas" style="position:absolute;inset:-30%;width:160%;height:160%"></canvas></button>
  <div class="v-text" id="vText"></div>
  <div class="v-ctl">
    <button class="round" id="vSpeak" title="Speak replies aloud"><svg class="i"><use href="#volume"/></svg></button>
    <button class="round" id="vHands" title="Hands-free: listen again after each reply"><svg class="i"><use href="#loop"/></svg></button>
    <button class="round v-end" id="vEnd" aria-label="End voice"><svg class="i"><use href="#x"/></svg></button>
  </div>
  <div class="v-opt"><span id="vHint">Space to talk · Esc to close</span><select id="voiceSel" aria-label="Voice"></select></div>
</div>

<div class="toast" id="toast"></div>
<audio id="ttsAudio" preload="auto"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></symbol>
  <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>

<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ic=(n,cls="")=>`<svg class="i ${cls}"><use href="#${n}"/></svg>`;
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const first=n=>String(n||"").split(" ")[0];
const label=f=>String(f||"").split("/").pop();
function ago(ts){if(!ts)return"";const s=(Date.now()-new Date(ts))/1e3;if(s<50)return"now";if(s<3600)return Math.round(s/60)+"m";if(s<86400)return Math.round(s/3600)+"h";return Math.round(s/86400)+"d"}
function agoText(ts){const a=ago(ts);return a==="now"?"just now":a?a+" ago":""}
function plural(n,w){return `${n} ${w}${n===1?"":"s"}`}
async function api(path,body,method){
  const r=await fetch(path,{method:method||(body?"POST":"GET"),headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||j.message||`Request failed (${r.status})`); return j;
}
function toast(t,ok){const el=$("#toast");el.innerHTML=(ok?ic("check"):"")+h(t);el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2600)}

function avatar(e,size=36,dot=true){
  const w=(e.name||"?").trim().split(/\s+/), ini=w.length>1?(w[0][0]+w[1][0]).toUpperCase():w[0].slice(0,1).toUpperCase()+w[0].slice(1,2);
  const hue=e.hue??220;
  return `<span class="av ${e.busy&&e.enabled?"busy":""}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px;background:linear-gradient(140deg,hsl(${hue} 80% 68%),hsl(${(hue+28)%360} 65% 42%))">${h(ini)}${dot?`<span class="dot ${e.enabled?"on":""}"></span>`:""}</span>`;
}
function spark(vals,w=96,ht=34){
  const max=Math.max(1,...vals),st=w/(vals.length-1),p=vals.map((v,i)=>[i*st,ht-2-(v/max)*(ht-6)]);
  let d=`M${p[0][0]} ${p[0][1]}`; for(let i=1;i<p.length;i++){const [x0,y0]=p[i-1],[x1,y1]=p[i],cx=(x0+x1)/2; d+=` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`}
  return `<svg class="spark" width="${w}" height="${ht}" aria-hidden="true"><defs><linearGradient id="spg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${ht} L0 ${ht}Z" fill="url(#spg)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}
const fileState=c=>S.drafts.some(d=>d.folder===c.folder)?["draft","Draft waiting"]:(c.last_outbound_at&&(!c.last_inbound_at||c.last_outbound_at>c.last_inbound_at))?["wait","Waiting on them"]:c.last_inbound_at?["owe","We owe a reply"]:["","New"];

function greet(){const hr=new Date().getHours();return hr<12?"Good morning":hr<18?"Good afternoon":"Good evening"}
function summary(){
  const k=S.kpis, on=S.employees.filter(e=>e.enabled).length, parts=[];
  parts.push(k.awaiting?`<b>${plural(k.awaiting,"draft")}</b> ${k.awaiting===1?"needs":"need"} your approval`:"Nothing needs your approval");
  if(S.decisions_open) parts.push(`<b>${plural(S.decisions_open,"decision")}</b> only you can make`);
  if(k.overdue) parts.push(`<b>${plural(k.overdue,"file")}</b> waiting on the other side`);
  return `${parts.join(", ")}. The team has filed ${plural(k.filed_today,"email")} today, with ${on} of ${S.employees.length} staff on.`;
}

function tl(a){const e=who(a.employee);return `<div class="tl"><div class="when">${ago(a.ts)}</div><div class="node"><span style="background:hsl(${e.hue??220} 70% 55%)"></span></div><div class="txt"><b>${h(first(e.name))}</b> ${h(a.text)}</div></div>`}

  :`<div class="card empty" style="padding:80px 20px"><b>You're all caught up</b>The team's drafts will appear here for your decision.</div>`}</div>`;

function noteHtml(n){
  if(!n) return "";
  const parts=n.split("|").map(x=>x.trim()).slice(2), meta=[], extra=[];
  for(const p of parts){ const m=p.match(/^(step|deadline):\s*(.+)$/i); if(m&&m[2]) meta.push(`<b style="font-weight:500;color:var(--ink)">${m[1][0].toUpperCase()+m[1].slice(1)}</b> ${h(m[2])}`); else if(/^NOTE:/i.test(p)) extra.push(h(p.replace(/^NOTE:\s*/i,""))); else if(p) extra.push(h(p)); }
  if(!meta.length&&!extra.length) return "";
  return `<div class="note">${ic("flag")}<span>${meta.join(" &nbsp;·&nbsp; ")}${extra.length?`${meta.length?"<br>":""}${extra.join("<br>")}`:""}</span></div>`;
}

/* ============ Logic: decisions + standing orders ============ */
let chosenOpt={};
function decisionCard(d){
  const e=emp(d.employee), sg=d.suggestion||{}, opts=[sg.recommended,...(sg.options||[])].filter(Boolean), sel=chosenOpt[d.id]??0;
  return `<article class="card dcard" data-decision="${d.id}">
    <div class="ask-by">${avatar(e,26,false)}<span><b>${h(first(e.name))}</b> needs a decision · ${agoText(d.created_at)}${d.folder?` · ${h(label(d.folder))}`:""}</span></div>
    <div class="sit">${h(d.situation)}</div>
    ${sg.why_new?`<div class="muted" style="font-size:13.5px">${h(sg.why_new)}</div>`:""}
    ${opts.length?`<div class="opts">${opts.map((o,i)=>`<button class="opt ${sel===i?"sel":""}" data-opt="${d.id}:${i}"><span class="n">${i?i:"★"}</span><span>${h(o)}${i?"":`<span class="muted" style="display:block;font-size:12px;margin-top:3px">${h(S.assistant)}'s recommendation</span>`}</span></button>`).join("")}</div>`:""}
    ${sg.risk_if_wrong?`<div class="risk"><b>If we get it wrong:</b> ${h(sg.risk_if_wrong)}</div>`:""}
    <div class="field" style="margin:0"><textarea class="in" id="dAns${d.id}" placeholder="Or tell ${h(first(e.name))} exactly what to do, in your own words" style="min-height:64px"></textarea></div>
    <label class="remember"><input type="checkbox" id="dRem${d.id}" checked> Remember this as a standing order, so the team handles it the same way next time</label>
    <div style="display:flex;gap:8px;align-items:center"><button class="btn accent" data-decide="${d.id}">${ic("check")}Decide</button><button class="btn quiet" data-dismiss="${d.id}">Dismiss</button>
      <button class="btn quiet" style="margin-left:auto" data-ask="Talk me through decision #${d.id}: ${h(d.situation.slice(0,120))}">Ask ${h(S.assistant)}</button></div>
  </article>`;
}

  ${open.length?`<div class="stack" style="margin-bottom:34px">${open.map(decisionCard).join("")}</div>`:`<div class="card empty" style="margin-bottom:34px"><b>Nothing to decide</b>When an agent meets something your orders don't cover, it asks here instead of guessing.</div>`}

  <div class="card addrule"><div class="field"><label for="rWhen">When</label><input class="in" id="rWhen" placeholder="e.g. An insurer offers less than 70% of the hire charges"></div>
    <div class="field"><label for="rDo">Do</label><input class="in" id="rDo" placeholder="e.g. Counter at full value with the GTA benchmark; never accept on the call"></div>

}

function render(){ if(!S)return; renderBar(); $("#main").innerHTML=VIEWS[view](); if(sheetFor) renderSheet(); mountDeck(); }
let lastKey="";
async function refresh(force){
  try{const n=await api("/api/state");try{n.reports=await api("/api/reports")}catch{n.reports=[]}
    const key=JSON.stringify(n); if(!force&&key===lastKey)return;
    const typing=!force&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    noteChanges(n); S=n; lastKey=key; if(typing){renderBar();return} render();
  }catch(e){console.warn(e)}
}
function go(v){if(v===view)return;view=v;ls.set("hub.view",v);render();scrollTo({top:0})}

/* ============ sheets & modals ============ */
function openSheet(kind,id){sheetFor={kind,id};renderSheet(true);$("#sheet").classList.add("on");$("#scrim").classList.add("on");$("#fab").classList.add("hidden")}
function closeSheet(){sheetFor=null;$("#sheet").classList.remove("on","wide");if(!$("#modal").classList.contains("on"))$("#scrim").classList.remove("on");$("#fab").classList.remove("hidden")}
function renderSheet(force){
  const el=$("#sheet"), {kind,id}=sheetFor; el.classList.toggle("wide",kind==="report");
  if(!force && el.querySelector("textarea:focus,input:focus,select:focus")) return;
  if(!force && kind==="report") return;
  if(kind==="person"){
    const e=emp(id), tasks=S.tasks.filter(t=>t.employee===e.id);
    el.innerHTML=`<div class="sheet-h">${avatar(e,44)}<div style="flex:1;min-width:0"><div class="t">${h(e.name)}</div><div class="s">${h(e.title)}</div></div>
      <label class="sw"><input type="checkbox" data-toggle="${e.id}" ${e.enabled?"checked":""} aria-label="On or off"><span></span></label><button class="icon-btn" data-close aria-label="Close">${ic("x")}</button></div>
    <div class="sheet-b">
      <div class="blk"><h4>Now</h4><div style="color:var(--ink2)">${!e.enabled?"Switched off. Tasks wait until they're back on.":e.last?`${h(e.last.text)} <span class="muted">· ${agoText(e.last.ts)}</span>`:"Ready for work."}</div>
        ${e.id==="harry"?`<div class="helpers" style="margin-top:12px">${Object.keys(S.harry_helpers).map(k=>`<span class="tag">${h(k.replace(/_/g," "))}</span>`).join("")}</div>`:""}</div>
      <div class="blk"><h4>Give ${h(first(e.name))} a task</h4>
        <div class="field"><input class="in" id="tTitle" placeholder="What do you need done?"></div>
        <div class="field"><textarea class="in" id="tDetails" placeholder="Details, deadlines, what you want back (optional)" style="min-height:70px"></textarea></div>
        <div class="row2"><select class="in" id="tFile" aria-label="Claim file"><option value="">No claim file</option>${S.claims.map(c=>`<option value="${h(c.folder)}">${h(label(c.folder))}</option>`).join("")}</select>
        <button class="btn primary" data-give="${e.id}">${ic("arrow")}Give task</button></div></div>
      <div class="blk"><h4>Tasks</h4>${tasks.length?tasks.map(t=>`<div class="task"><div class="t">${h(t.title)}<span class="badge ${t.status}">${t.status[0].toUpperCase()+t.status.slice(1)}</span></div>
          <div class="s">${t.summary?h(t.summary):`<span class="muted">#${t.id} · ${agoText(t.created_at)}${t.folder?` · ${h(label(t.folder))}`:""}</span>`}</div>
          ${t.result?`<button class="link" data-open-task="${t.id}">${openTask===t.id?"Hide result":"Show result"}</button>${openTask===t.id?`<div class="result">${t.result}</div>`:""}`:""}
          ${t.status==="queued"?`<button class="link" data-cancel="${t.id}">Cancel</button>`:""}</div>`).join(""):`<div class="muted">No tasks yet.</div>`}</div>
      <div class="blk"><h4>Brief</h4><textarea class="in" id="brief" placeholder="Standing instructions, on top of the firm's playbooks">${h(e.role_prompt||"")}</textarea>
        <div class="foot">${e.kind==="custom"?`<button class="btn quiet danger" data-fire="${e.id}" style="margin-right:auto">Remove from team</button>`:""}<button class="btn" data-brief="${e.id}">Save brief</button></div></div>
    </div>`;
  } else if(kind==="file"){
    const c=S.claims.find(x=>x.folder===id); if(!c) return closeSheet(); const [k,l]=fileState(c);
    const dt=x=>x?new Date(x).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"}):"—";
    el.innerHTML=`<div class="sheet-h"><div style="flex:1"><div class="t">${h(c.client_name)}</div><div class="s">${h(c.reference)}</div></div><button class="icon-btn" data-close aria-label="Close">${ic("x")}</button></div>
    <div class="sheet-b"><div class="blk"><span class="state ${k}"><i></i>${l}</span><p style="color:var(--ink2);margin:12px 0 0">${h(c.last_summary||"")}</p></div>
      <div class="blk"><h4>Timeline</h4><dl class="kv"><dt>Last in</dt><dd>${dt(c.last_inbound_at)}</dd><dt>Last out</dt><dd>${dt(c.last_outbound_at)}</dd>
        <dt>Chase step</dt><dd><div class="ladder" style="margin-top:7px">${[1,2,3,4,5].map(i=>`<i class="${c.chase_level>=i?"on":""}"></i>`).join("")}</div></dd>
        <dt>Mailbox folder</dt><dd>${h(c.folder)}</dd></dl></div>
      <div class="blk"><h4>Give a task on this file</h4><div class="field"><select class="in" id="fEmp" aria-label="Employee">${S.employees.map(e=>`<option value="${e.id}">${h(e.name)}</option>`).join("")}</select></div>
        <div class="field"><input class="in" id="tTitle" placeholder="e.g. Draft a letter before claim"></div><div class="foot"><button class="btn primary" data-give-file="${h(c.folder)}">${ic("arrow")}Give task</button></div></div>
      <div class="blk"><button class="btn" data-ask="Talk me through the ${h(c.client_name)} file (${h(c.reference)}) and what we should do next.">Ask ${h(S.assistant)} about this file</button></div></div>`;
  } else if(kind==="report"){
    el.innerHTML=`<div class="sheet-h">${avatar(emp("hemant"),36,false)}<div style="flex:1"><div class="t">Daily claims audit</div><div class="s">${h(reportDate(id))}</div></div><button class="icon-btn" data-close aria-label="Close">${ic("x")}</button></div>
      <iframe class="rep" sandbox src="/reports/${encodeURIComponent(id)}" title="Hemant's report"></iframe>`;
  } else if(kind==="chat"){ renderChat(); }
}
function modal(html){$("#modal").innerHTML=html;$("#modal").classList.add("on");$("#scrim").classList.add("on");setTimeout(()=>$("#modal input,#modal textarea")?.focus(),60)}
function closeModal(){$("#modal").classList.remove("on");if(!sheetFor)$("#scrim").classList.remove("on")}

    <label class="remember" style="margin-bottom:10px"><input type="checkbox" id="sGreet" ${greetAloud?"checked":""}> Greet me out loud when the hub opens</label>

/* ============ events ============ */
document.addEventListener("click",async ev=>{
  if(ev.target.closest(".sw")) return;  // switches are handled on change
  const t=ev.target.closest("[data-opt],[data-decide],[data-dismiss],[data-rule-del],[data-ask-voice],[data-mic],#rAdd,#replayBtn,#deckOrb,[data-view],[data-person],[data-file],[data-draft],[data-approve],[data-reject],[data-hire],[data-close],[data-hue],[data-give],[data-give-file],[data-brief],[data-fire],[data-cancel],[data-open-task],[data-report],[data-filter],[data-ask],#themeBtn,#setBtn,#hSave,#sSave,#askMic,#fab");
  if(!t)return; const d=t.dataset;
  try{
    if(d.view) return go(d.view);
    if(d.opt){ const [id,i]=d.opt.split(":"); chosenOpt[id]=+i; return render(); }
    if(d.decide){ const id=+d.decide, dec=S.decisions.find(x=>x.id===id), sg=dec?.suggestion||{}, opts=[sg.recommended,...(sg.options||[])].filter(Boolean);
      const typed=$("#dAns"+id).value.trim(), chosen=opts[chosenOpt[id]??0]||""; if(!typed&&!chosen) return toast("Pick an option or type what to do");
      t.disabled=true; const r=await api(`/api/decisions/${id}/answer`,{answer:typed,chosen,remember:$("#dRem"+id).checked});
      toast(r.rule_id?"Decided. Saved as a standing order.":"Decided.",1); return refresh(true); }
    if(d.dismiss){ await api(`/api/decisions/${d.dismiss}/dismiss`,{}); return refresh(true); }
    if(d.ruleDel){ if(!confirm("Delete this standing order?")) return; await api("/api/rules/"+d.ruleDel,null,"DELETE"); return refresh(true); }
    if(d.askVoice!==undefined){ openVoice(false); return askText(d.askVoice,true); }
    if(d.mic!==undefined) return openVoice(true);
    if(d.person!==undefined) return openSheet("person",d.person);
    if(d.file) return openSheet("file",d.file);
    if(d.report) return openSheet("report",d.report);
    if(d.draft){ selDraft=d.draft; if(view!=="approvals"){view="approvals";ls.set("hub.view",view);scrollTo({top:0})} return render(); }
    if(d.filter){ fileF=d.filter; return render(); }
    if(d.hire) return hireModal();
    if(d.close!==undefined){ if($("#modal").classList.contains("on")) return closeModal(); return closeSheet(); }
    if(d.hue){ hireHue=+d.hue; $$(".hues button").forEach(b=>b.classList.toggle("sel",b===t)); return; }
    if(d.ask!==undefined) return askText(d.ask);
    if(d.approve) return decide(d.approve,true,t);
    if(d.reject) return decide(d.reject,false,t);
    if(d.give){ const title=$("#tTitle").value.trim(); if(!title) return toast("What's the task?");
      await api("/api/tasks",{employee:d.give,title,details:$("#tDetails").value,folder:$("#tFile").value}); toast(`Task given to ${first(emp(d.give).name)}`,1); $("#tTitle").value="";$("#tDetails").value=""; document.activeElement.blur(); return refresh(true); }
    if(d.giveFile){ const title=$("#tTitle").value.trim(); if(!title) return toast("What's the task?"); const e=$("#fEmp").value;
      await api("/api/tasks",{employee:e,title,details:"",folder:d.giveFile}); toast(`Task given to ${first(emp(e).name)}`,1); $("#tTitle").value=""; return refresh(true); }
    if(d.brief){ await api("/api/employees/"+d.brief,{role_prompt:$("#brief").value}); toast("Brief saved",1); document.activeElement.blur(); return refresh(true); }
    if(d.fire){ if(!confirm(`Remove ${emp(d.fire).name} from the team?`)) return; await api("/api/employees/"+d.fire,null,"DELETE"); closeSheet(); toast("Removed"); return refresh(true); }
    if(d.cancel){ await api(`/api/tasks/${d.cancel}/cancel`,{}); return refresh(true); }
    if(d.openTask){ openTask=openTask===+d.openTask?null:+d.openTask; return renderSheet(true); }
    switch(t.id){
      case "fab": return openChat();
      case "askMic": case "deckOrb": return openVoice(true);
      case "replayBtn": return sayGreeting(true);
      case "rAdd": { const w=$("#rWhen").value.trim(), dd=$("#rDo").value.trim(); if(!w||!dd) return toast("Fill in both When and Do");
        await api("/api/rules",{situation:w,instruction:dd}); toast("Standing order saved. The team follows it from the next job.",1); return refresh(true); }
      case "themeBtn": { const n=theme()==="dark"?"light":"dark"; document.documentElement.dataset.theme=n; ls.set("hub.theme",n); return renderBar(); }
      case "setBtn": return settingsModal();
      case "hSave": { const name=$("#hName").value.trim(); if(!name) return toast("Give them a name");
        await api("/api/employees",{name,title:$("#hTitle").value.trim(),role_prompt:$("#hBrief").value,hue:hireHue}); closeModal(); toast(`${name} has joined the team`,1); return refresh(true); }
      case "sSave": { if($("#sVoice")) ls.set("hub.voice",$("#sVoice").value); greetAloud=$("#sGreet").checked; announce=$("#sAnn").checked; ls.set("hub.greet",greetAloud); ls.set("hub.announce",announce);
        const body={assistant_name:$("#sName").value}; if($("#sTts")) body.tts_voice=$("#sTts").value;
        await api("/api/settings",body); closeModal(); toast("Saved",1); return refresh(true); }
    }
  }catch(e){ toast(e.message); }
});
async function decide(id,approve,btn){
  if(btn) btn.disabled=true;
  const L=S.drafts, i=L.findIndex(x=>x.id===id); selDraft=(L[i+1]||L[i-1]||{}).id||null;
  try{ const r=await api(`/api/drafts/${id}/${approve?"approve":"reject"}`,{}); toast(r.message,approve); }catch(e){ toast(e.message); }
  refresh(true);
}
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.dataset.ruleToggle){ try{ await api("/api/rules/"+t.dataset.ruleToggle,{active:t.checked?1:0}); refresh(true);}catch(e){toast(e.message)} return; }
  if(!t.dataset.toggle) return;
  try{ await api(`/api/employees/${t.dataset.toggle}/toggle`,{on:t.checked}); toast(`${first(emp(t.dataset.toggle).name)} is ${t.checked?"on":"off"}`,1); t.blur(); refresh(true);}catch(e){toast(e.message)}
});
document.addEventListener("input",ev=>{ if(ev.target.id==="fileQ"){ fileQ=ev.target.value; const p=ev.target.selectionStart; render(); const q=$("#fileQ"); q.focus(); q.setSelectionRange(p,p);} });
document.addEventListener("submit",ev=>{ if(ev.target.id==="askForm"){ ev.preventDefault(); const v=$("#askIn").value.trim(); if(v){ $("#askIn").value=""; askText(v); } } });
document.addEventListener("keydown",ev=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  const voiceOn=$("#voice").classList.contains("on");
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="k"){ ev.preventDefault(); return openChat(); }
  if(ev.key==="Escape"){ if(voiceOn) return closeVoice(); if($("#modal").classList.contains("on")) return closeModal(); if(sheetFor) return closeSheet(); }
  if(voiceOn&&ev.code==="Space"&&!typing){ ev.preventDefault(); return listening?stopListening():startListening(); }
  if(typing||sheetFor||voiceOn||$("#modal").classList.contains("on")) return;
  if(/^[1-5]$/.test(ev.key)) return go(TABS[+ev.key-1][0]);
  if(view==="approvals"&&S?.drafts.length){
    const L=S.drafts,i=L.findIndex(x=>x.id===selDraft);
    if(ev.key==="j"||ev.key==="ArrowDown"){ev.preventDefault();selDraft=(L[i+1]||L[i]).id;render()}
    if(ev.key==="k"||ev.key==="ArrowUp"){ev.preventDefault();selDraft=(L[i-1]||L[i]).id;render()}
    if(ev.key==="a") decide(selDraft,true); if(ev.key==="r") decide(selDraft,false);
  }
  const f=document.activeElement?.dataset; if(ev.key==="Enter"&&f?.person) openSheet("person",f.person); if(ev.key==="Enter"&&f?.file) openSheet("file",f.file);
});
$("#scrim").addEventListener("click",()=>{ if($("#modal").classList.contains("on")) closeModal(); else closeSheet(); });

/* ============ assistant: chat ============ */
let history=ls.get("hub.chat",[]), thinking=false;
function openChat(){ openSheet("chat"); setTimeout(()=>$("#chatIn")?.focus(),350); }
function md(t){const L=h(t).split("\n");let o="",ul=false;for(const l of L){const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!ul){o+="<ul>";ul=true}o+=`<li>${m[1]}</li>`}else{if(ul){o+="</ul>";ul=false}if(l.trim())o+=`<p>${l}</p>`}}if(ul)o+="</ul>";return o.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")}
function renderChat(){
  const el=$("#sheet"), draft=$("#chatIn")?.value||"";
  el.innerHTML=`<div class="sheet-h"><div class="orb" style="width:34px;height:34px"><i></i><i></i><i></i></div><div style="flex:1"><div class="t">${h(S.assistant)}</div><div class="s">Your assistant</div></div>
    <button class="btn sm quiet" id="toVoice">${ic("mic")}Voice</button>${history.length?`<button class="btn sm quiet" id="clearChat">Clear</button>`:""}<button class="icon-btn" data-close aria-label="Close">${ic("x")}</button></div>
  <div class="sheet-b" id="chatBody">${history.length?`<div class="chat">${history.map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${m.role==="user"?h(m.content):md(m.content)}${(m.actions||[]).map(a=>`<span class="done-tag">${ic("check")}${h(a)}</span>`).join("")}</div>`).join("")}${thinking?`<div class="msg a"><span class="dots"><i></i><i></i><i></i></span></div>`:""}</div>`
    :`<div class="welcome"><div class="orb"><i></i><i></i><i></i></div><h3>How can I help, ${h(S.director)}?</h3><p>I watch the whole team. Ask for a briefing, or tell me to switch someone off or hand out a task.</p>
      <div class="chips">${["Brief me","What needs my approval?","Which files are overdue?","Give Hemant an audit of the Rafiq file"].map(c=>`<button class="chip" data-ask="${h(c)}">${h(c)}</button>`).join("")}</div></div>`}</div>
  <div class="composer"><div class="composer-in"><textarea id="chatIn" rows="1" placeholder="Message ${h(S.assistant)}">${h(draft)}</textarea>
    <button class="round light" id="chatMic" aria-label="Talk">${ic("mic")}</button><button class="round dark" id="chatSend" aria-label="Send">${ic("up")}</button></div></div>`;
  const b=$("#chatBody"); b.scrollTop=b.scrollHeight;
  $("#chatSend").onclick=()=>{const v=$("#chatIn").value.trim(); if(v){$("#chatIn").value="";askText(v)}};
  $("#chatIn").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#chatSend").click()}};
  $("#chatIn").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(140,e.target.scrollHeight)+"px"};
  $("#chatMic").onclick=()=>openVoice(true); $("#toVoice").onclick=()=>openVoice(false);
  const c=$("#clearChat"); if(c) c.onclick=()=>{history=[];ls.set("hub.chat",history);renderChat()};
}
async function askText(text,spoken){
  text=(text||"").trim(); if(!text||thinking) return;
  if(!spoken && sheetFor?.kind!=="chat") openSheet("chat");
  history.push({role:"user",content:text}); thinking=true; if(sheetFor?.kind==="chat") renderChat(); orbs.forEach(o=>o.set("thinking"));
  if(spoken) vSet("Thinking",undefined,text);
  try{
    const r=await api("/api/assistant",{history:history.map(({role,content})=>({role,content})),voice:!!spoken});
    history.push({role:"assistant",content:r.reply,actions:r.actions}); if(r.actions?.length) refresh(true);
    thinking=false; if(sheetFor?.kind==="chat") renderChat(); orbs.forEach(o=>o.set("idle"));
    if(spoken){ vSet("", r.reply); if(speakOn) speak(r.reply); else if(handsFree) setTimeout(startListening,400); }
  }catch(e){ thinking=false; orbs.forEach(o=>o.set("idle")); history.push({role:"assistant",content:"I couldn't reach the team: "+e.message}); if(sheetFor?.kind==="chat") renderChat(); if(spoken) vSet("","Sorry, something went wrong."); }
  history=history.slice(-40); ls.set("hub.chat",history);
}

/* ============ assistant: voice ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition, canHear=!!SR, canSpeak="speechSynthesis" in window;
let speakOn=ls.get("hub.speak",true), handsFree=ls.get("hub.hands",false), voices=[], speaking=false, listening=false, rec=null, analyser=null, mic=null, energy=0;
function syncVoiceBtns(){ $("#vSpeak").classList.toggle("on",speakOn); $("#vHands").classList.toggle("on",handsFree); }
function vSet(state,text,user){ $("#vState").textContent=state||(listening?"Listening":speaking?"Speaking":thinking?"Thinking":"Tap to talk"); const t=$("#vText"); if(user!==undefined){t.textContent=user;t.classList.add("user")} else if(text!==undefined){t.textContent=text.length>260?text.slice(0,260)+"…":text;t.classList.remove("user")} }
function openVoice(listen){ if(!canHear){ toast("Voice needs Chrome or Edge on this computer"); return openChat(); } $("#voice").classList.add("on"); $("#fab").classList.add("hidden"); vSet("", ""); syncVoiceBtns(); if(listen) startListening(); }
function closeVoice(){ stopListening(); stopSpeaking(); $("#voice").classList.remove("on"); if(!sheetFor) $("#fab").classList.remove("hidden"); }
$("#vEnd").onclick=closeVoice; $("#vOrb").onclick=()=>listening?stopListening():startListening();
$("#vSpeak").onclick=()=>{speakOn=!speakOn;ls.set("hub.speak",speakOn);syncVoiceBtns();if(!speakOn)stopSpeaking()};
$("#vHands").onclick=()=>{handsFree=!handsFree;ls.set("hub.hands",handsFree);syncVoiceBtns()};
function loadVoices(){
  if(!canSpeak) return; voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const rank=v=>(/natural|neural|online|premium|enhanced/i.test(v.name)?0:4)+(/en-GB/i.test(v.lang)?0:2)+(/libby|sonia|maisie|serena|kate|female/i.test(v.name)?0:1);
  voices.sort((a,b)=>rank(a)-rank(b)); const sel=$("#voiceSel"), saved=ls.get("hub.voice","");
  sel.innerHTML=voices.map(v=>`<option ${v.name===saved?"selected":""}>${h(v.name)}</option>`).join(""); sel.style.display=voices.length?"":"none";
}
if(canSpeak){loadVoices();speechSynthesis.onvoiceschanged=loadVoices} else $("#voiceSel").style.display="none";
$("#voiceSel").onchange=e=>ls.set("hub.voice",e.target.value);
/* ---- speech out: natural voice sentence by sentence (fast start), browser voice as fallback ---- */
let previewVoice=null;
document.addEventListener("click",ev=>{ if(ev.target.id==="sPreview"){ gestured=true; previewVoice=$("#sTts").value; speak(`Hello ${S.director}. This is how I'll sound.`,{replay:true}).finally?.(()=>{}); setTimeout(()=>previewVoice=null,15000); } });
const ttsEl=$("#ttsAudio"); let ttsCtx=null, ttsAn=null, lastSaid="", speakSeq=0;
function clean(t){return t.replace(/\*\*|[#*_`]/g,"").replace(/^\s*[-•]\s*/gm,"").replace(/\s+/g," ").trim()}
function sentences(t){const out=[];let buf="";for(const part of t.split(/(?<=[.!?])\s+(?=[A-Z0-9£"'])/)){buf=buf?buf+" "+part:part;if(buf.length>=40){out.push(buf);buf=""}}if(buf)out.push(buf);return out.length?out:[t]}
function ttsAnalyser(){ if(ttsAn) return ttsAn; try{ ttsCtx=new(window.AudioContext||window.webkitAudioContext)(); const src=ttsCtx.createMediaElementSource(ttsEl); ttsAn=ttsCtx.createAnalyser(); ttsAn.fftSize=256; ttsAn.smoothingTimeConstant=.8; src.connect(ttsAn); ttsAn.connect(ttsCtx.destination);}catch{} return ttsAn; }
function onSpeakStart(){speaking=true;vSet();$("#vOrb").classList.add("live");orbs.forEach(o=>o.set("speaking"))}
function onSpeakEnd(){speaking=false;$("#vOrb").classList.remove("live");vSet();orbs.forEach(o=>o.set(listening?"listening":"idle")); if(handsFree&&$("#voice").classList.contains("on")) setTimeout(startListening,300)}
function stopSpeaking(){ speakSeq++; if(canSpeak) speechSynthesis.cancel(); try{ttsEl.pause();ttsEl.removeAttribute("src");ttsEl.load()}catch{} if(speaking) onSpeakEnd(); }
async function speak(text,{replay=false}={}){
  text=clean(text); if(!text) return; stopSpeaking(); const seq=speakSeq; if(!replay) lastSaid=text;
  if(S?.tts_ready){
    try{
      ttsAnalyser(); if(ttsCtx?.state==="suspended") await ttsCtx.resume();
      const parts=sentences(text);
      const fetches=parts.map(p=>fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:p,voice:previewVoice||undefined})}).then(r=>r.ok?r.blob():null).catch(()=>null));
      onSpeakStart();
      for(const f of fetches){ if(seq!==speakSeq) return; const b=await f; if(!b){ throw new Error("tts"); }
        await new Promise(res=>{ ttsEl.src=URL.createObjectURL(b); ttsEl.onended=ttsEl.onerror=()=>res(); ttsEl.play().catch(()=>res()); }); }
      if(seq===speakSeq) onSpeakEnd(); return;
    }catch{ if(seq!==speakSeq) return; /* fall through to the browser voice */ }
  }
  if(!canSpeak){ onSpeakEnd(); return; }
  const u=new SpeechSynthesisUtterance(text);
  const v=voices.find(v=>v.name===ls.get("hub.voice",""))||voices[0]; if(v){u.voice=v;u.lang=v.lang} u.rate=1.03;
  u.onstart=onSpeakStart; u.onboundary=()=>{energy=1}; u.onend=u.onerror=onSpeakEnd;
  speechSynthesis.speak(u);
}
function audioLevel(){
  let lvl=0; const bins=new Uint8Array(64);
  if(analyser){analyser.getByteFrequencyData(bins);lvl=bins.reduce((a,b)=>a+b,0)/64/255}
  else if(speaking&&ttsAn&&!ttsEl.paused){ttsAn.getByteFrequencyData(bins);lvl=bins.slice(0,24).reduce((a,b)=>a+b,0)/24/255}
  else if(speaking){energy*=.92;lvl=.12+.22*energy}
  return {lvl,bins};
}

/* ---- greeting ---- */
let greetingText="", greeted=false, greetAloud=ls.get("hub.greet",true), announce=ls.get("hub.announce",true), gestured=false;
async function loadGreeting(){
  try{ const g=await api("/api/greeting"); greetingText=g.text; typeInto($("#deckSay"),g.text); if(greetAloud&&!greeted){ greeted=true; sayGreeting(); } }catch{}
}
function typeInto(el,text){ if(!el) return; let i=0; el.innerHTML='<span class="cur"></span>'; const step=()=>{ i+=2; el.innerHTML=h(text.slice(0,i))+(i<text.length?'<span class="cur"></span>':""); if(i<text.length) setTimeout(step,14); }; step(); }
async function sayGreeting(force){
  if(!greetingText) return;
  if(!gestured&&!force){ pendingGreeting=true; return; }  // browsers need a click before audio can play
  speak(greetingText);
}
let pendingGreeting=false;
addEventListener("pointerdown",()=>{ gestured=true; if(pendingGreeting){ pendingGreeting=false; if(greetAloud) speak(greetingText); } },{once:true});

/* ---- proactive announcements: what changed since you last looked ---- */
let seenDrafts=null, seenDecisions=null, seenDone=null, annQueue=[], annTimer=null;
function noteChanges(n){
  const dr=new Set(n.drafts.map(d=>d.id)), de=new Set(n.decisions.map(d=>d.id)), done=new Set(n.tasks.filter(t=>t.status==="done").map(t=>t.id));
  if(seenDrafts){
    const nd=n.drafts.filter(d=>!seenDrafts.has(d.id)); if(nd.length) annQueue.push(nd.length===1?`${first(emp(nd[0].agent).name)} has a draft for you: ${nd[0].subject}.`:`${nd.length} new drafts are waiting for you.`);
    const nq=n.decisions.filter(d=>!seenDecisions.has(d.id)); if(nq.length) annQueue.push(`${first(emp(nq[0].employee).name)} needs a decision from you${nq.length>1?`, and ${nq.length-1} more`:""}.`);
    const nt=n.tasks.filter(t=>t.status==="done"&&!seenDone.has(t.id)); if(nt.length) annQueue.push(nt.length===1?`${first(emp(nt[0].employee).name)} has finished: ${nt[0].title}.`:`${nt.length} tasks have finished.`);
  }
  seenDrafts=dr; seenDecisions=de; seenDone=done;
  if(annQueue.length){ clearTimeout(annTimer); annTimer=setTimeout(flushAnnouncements,3000); }
}
function flushAnnouncements(){
  if(!annQueue.length) return; if(speaking||listening||thinking){ annTimer=setTimeout(flushAnnouncements,3000); return; }
  const line=annQueue.splice(0,3).join(" "); annQueue=[]; toast(line); if(announce&&gestured&&document.visibilityState==="visible") speak(line);
}

/* ---- particle orb (own implementation): a thin cloud of light that reacts to voice ---- */
const orbs=[];
class Orb{
  constructor(cv,n=640,gain=1){ this.cv=cv; this.c=cv.getContext("2d"); this.n=n; this.gain=gain; this.p=[]; this.v=[];
    for(let i=0;i<n;i++){ const u=Math.random()*2-1, th=Math.random()*Math.PI*2, r=Math.cbrt(Math.random()); const s=Math.sqrt(1-u*u); this.p.push([r*s*Math.cos(th),r*s*Math.sin(th),r*u]); this.v.push([0,0,0]); }
    this.cur={r:1,speed:.2,bright:.5,lines:.15,size:1}; this.tgt={...this.cur}; this.rot=[0,0]; this.energy=0; this.state="idle"; this.t=0; orbs.push(this); }
  set(state){ if(state===this.state) return; this.state=state; this.energy=1;
    this.tgt={idle:{r:1,speed:.2,bright:.5,lines:.15,size:1},listening:{r:.82,speed:.3,bright:.7,lines:.4,size:1.1},thinking:{r:.62,speed:.55,bright:.75,lines:1,size:.9},speaking:{r:.7,speed:.25,bright:.8,lines:.8,size:1.1}}[state]||this.tgt; }
  frame(level,bins,colour){
    const cv=this.cv, r=cv.getBoundingClientRect(); if(!r.width) return; const dpr=Math.min(2,devicePixelRatio||1);
    if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
    const c=this.c,W=cv.width,H=cv.height,R=Math.min(W,H)*(this.gain>1?.42:.36); c.clearRect(0,0,W,H);
    for(const k in this.tgt) this.cur[k]+=(this.tgt[k]-this.cur[k])*.03;
    this.energy*=.985; this.t+=.016*this.cur.speed; this.rot[0]+=.0025*this.cur.speed+this.energy*.01; this.rot[1]+=.0012*this.cur.speed;
    const bass=level, radius=this.cur.r*(1+bass*.18), cx=W/2, cy=H/2, cosY=Math.cos(this.rot[0]),sinY=Math.sin(this.rot[0]),cosX=Math.cos(this.rot[1]),sinX=Math.sin(this.rot[1]);
    const pts=new Array(this.n);
    for(let i=0;i<this.n;i++){ const p=this.p[i], v=this.v[i];
      v[0]+=Math.sin(this.t*1.3+p[1]*4)*.0006*this.cur.speed; v[1]+=Math.cos(this.t*1.1+p[2]*4)*.0006*this.cur.speed; v[2]+=Math.sin(this.t*.9+p[0]*4)*.0006*this.cur.speed;
      const d=Math.hypot(p[0],p[1],p[2])||1, pull=(d-1)*.004; v[0]-=p[0]/d*pull; v[1]-=p[1]/d*pull; v[2]-=p[2]/d*pull;
      p[0]+=v[0];p[1]+=v[1];p[2]+=v[2]; v[0]*=.99;v[1]*=.99;v[2]*=.99;
      let x=p[0]*cosY-p[2]*sinY, z=p[0]*sinY+p[2]*cosY, y=p[1]*cosX-z*sinX; z=p[1]*sinX+z*cosX;
      const pulse=this.state==="speaking"?1+Math.sin(this.t*9+i)*bass*.08:1, sc=R*radius*pulse, pr=1/(1.9-z*.6);
      pts[i]=[cx+x*sc*pr,cy+y*sc*pr,pr,z];
    }
    c.globalCompositeOperation="lighter"; c.lineWidth=Math.max(1,dpr*.8);
    const la=(this.cur.lines*.14+bass*.08)*this.gain, th2=Math.pow(R*(.17+bass*.06),2); let drawn=0;
    if(la>.01){ c.strokeStyle=`rgba(${colour},${la})`; c.beginPath();
      for(let i=0;i<this.n&&drawn<2400;i+=3){ const a=pts[i]; for(let j=i+1;j<this.n;j+=2){ const b=pts[j]; const dx=a[0]-b[0],dy=a[1]-b[1]; if(dx*dx+dy*dy<th2*((a[2]+b[2])/2)){ c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); if(++drawn>=2400) break; } } }
      c.stroke(); }
    for(let i=0;i<this.n;i++){ const q=pts[i], a=Math.min(1,(this.cur.bright*.5+bass*.3)*(.45+q[2]*.4)*this.gain), sz=(this.cur.size*1.1+bass*.6)*q[2]*dpr; c.fillStyle=`rgba(${colour},${a})`; c.beginPath(); c.arc(q[0],q[1],sz,0,6.283); c.fill(); }
    // core glow
    const g=c.createRadialGradient(cx,cy,0,cx,cy,R*radius*.9); g.addColorStop(0,`rgba(${colour},${.18+bass*.25})`); g.addColorStop(1,`rgba(${colour},0)`); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.globalCompositeOperation="source-over";
  }
}
let deckOrb=null, voiceOrb=new Orb($("#vCanvas"),760);
function mountDeck(){ const cv=$("#deckCanvas"); if(cv&&(!deckOrb||deckOrb.cv!==cv)){ if(deckOrb) orbs.splice(orbs.indexOf(deckOrb),1); deckOrb=new Orb(cv,560,1.7); deckOrb.set(listening?"listening":speaking?"speaking":thinking?"thinking":"idle"); } }
function orbColour(){ return theme()==="dark"?"140,196,255":"37,99,235"; }
function startListening(){
  if(!canHear||listening) return; stopSpeaking();
  rec=new SR(); rec.lang="en-GB"; rec.interimResults=true; let fin="";
  rec.onresult=e=>{let tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}vSet("Listening",undefined,(fin+tmp).trim())};
  rec.onend=()=>{listening=false;$("#vOrb").classList.remove("live");stopMic();orbs.forEach(o=>o.set("idle"));const t=fin.trim();
    if(/^(say that again|repeat that|again please|pardon)\.?$/i.test(t)&&lastSaid){ vSet("",lastSaid); speak(lastSaid,{replay:true}); return; }
    if(t)askText(t,true);else vSet()};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("Allow the microphone for this page to talk")};
  try{rec.start();listening=true;$("#vOrb").classList.add("live");vSet("Listening",undefined,"");startMic();orbs.forEach(o=>o.set("listening"))}catch(e){toast(e.message)}
}
function stopListening(){try{rec&&rec.stop()}catch{}}
async function startMic(){try{mic=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=new(window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=256;ctx.createMediaStreamSource(mic).connect(analyser);analyser._c=ctx}catch{}}
function stopMic(){try{mic?.getTracks().forEach(t=>t.stop());analyser?._c.close()}catch{}analyser=null;mic=null}
(function draw(){
  const {lvl,bins}=audioLevel(), col=orbColour();
  if($("#voice").classList.contains("on")) voiceOrb.frame(lvl,bins,col);
  if(deckOrb&&document.contains(deckOrb.cv)&&document.visibilityState==="visible") deckOrb.frame(lvl,bins,"150,204,255");
  const st=$("#deckState"); if(st){ const s=listening?"listening":speaking?"speaking":thinking?"thinking":"online"; if(st.textContent!==s) st.textContent=s; }
  requestAnimationFrame(draw);
})();

/* ============ boot ============ */
(()=>{const t=ls.get("hub.theme",null); if(t) document.documentElement.dataset.theme=t; if(!TABS.some(x=>x[0]===view)) view="today";})();
refresh(true).then(loadGreeting); setInterval(()=>refresh(false),5000); setInterval(()=>{ if(S) renderBar(); },30000);
setInterval(()=>{ if(view==="today"&&!document.querySelector("input:focus,textarea:focus")) loadGreetingQuiet(); },20*60*1000);
async function loadGreetingQuiet(){ try{ const g=await api("/api/greeting"); if(g.text!==greetingText){ greetingText=g.text; const el=$("#deckSay"); if(el) el.textContent=g.text; } }catch{} }
