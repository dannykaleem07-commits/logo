<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boss Hub</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F2EF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0B10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boss Hub">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* =========================================================
   OBSIDIAN GLASS — tokens
   Dark-first. Light is "porcelain": the same glass system on
   warm tinted neutrals.
   ========================================================= */
:root{
  --bg:#0A0B10; --bg-2:#0E1017;
  --glass:rgba(255,255,255,.035); --glass-2:rgba(255,255,255,.065); --glass-3:rgba(255,255,255,.10);
  --solid:rgba(17,19,27,.82);           /* sheets, bar, modals (with backdrop blur) */
  --hair:rgba(255,255,255,.07); --hair-2:rgba(255,255,255,.12); --hi:rgba(255,255,255,.08);
  --ink:#EEF0F6; --ink-2:#A6ABBA; --ink-3:#777E92;
  --accent:#7FA8FF; --accent-2:#5B8CFF; --on-accent:#081230; --accent-soft:rgba(127,168,255,.14); --accent-line:rgba(127,168,255,.45);
  --green:#4ADE9B; --amber:#F5B04D; --red:#FF7B7B;
  --spec:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px -18px rgba(0,0,0,.6);
  --lift:0 2px 4px rgba(0,0,0,.25),0 26px 60px -24px rgba(0,0,0,.75);
  --float:0 60px 140px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.05);
  --aur-1:rgba(64,110,255,.30); --aur-2:rgba(40,200,210,.16); --aur-3:rgba(150,90,255,.18);
  --grain:.055; --scrim:rgba(4,5,9,.55);
  /* channel tokens: plain rgba() where the file once used color-mix(), so iOS 16.0-16.1 and old WebViews keep every colour */
  --accent-rgb:127,168,255; --green-rgb:74,222,155; --amber-rgb:245,176,77; --bg-rgb:10,11,16;
  --aur-1b:rgba(64,110,255,.105); --aur-2b:rgba(40,200,210,.056); --aur-3b:rgba(150,90,255,.063);
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",ui-serif,Georgia,serif;
  /* motion system */
  --out:cubic-bezier(.22,1,.36,1);          /* expo-ish out: content arriving */
  --spring:cubic-bezier(.34,1.45,.64,1);    /* slight overshoot: indicators, toasts, buttons */
  --soft:cubic-bezier(.4,0,.2,1);           /* colour / opacity */
  --in:cubic-bezier(.4,0,1,1);              /* things leaving */
  --d-fast:140ms; --d-base:260ms; --d-slow:520ms; --d-sheet:620ms;
  --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F2EF; --bg-2:#ECEBE7;
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.82); --glass-3:rgba(255,255,255,.95);
  --solid:rgba(250,250,248,.80);
  --hair:rgba(22,24,34,.075); --hair-2:rgba(22,24,34,.13); --hi:rgba(255,255,255,.95);
  --ink:#15171F; --ink-2:#5B6072; --ink-3:#7E8494;
  --accent:#2F63E8; --accent-2:#2554D6; --on-accent:#FFFFFF; --accent-soft:rgba(47,99,232,.10); --accent-line:rgba(47,99,232,.40);
  --green:#149A58; --amber:#BF7300; --red:#D63B3B;
  --spec:rgba(47,99,232,.07);
  --shadow:0 1px 1px rgba(20,24,40,.04),0 8px 24px -14px rgba(20,24,40,.18);
  --lift:0 2px 3px rgba(20,24,40,.05),0 24px 50px -24px rgba(20,24,40,.30);
  --float:0 50px 120px -30px rgba(20,24,40,.35),0 0 0 1px rgba(20,24,40,.05);
  --aur-1:rgba(80,130,255,.22); --aur-2:rgba(60,200,200,.16); --aur-3:rgba(190,150,255,.20);
  --grain:.035; --scrim:rgba(30,32,44,.28);
  --accent-rgb:47,99,232; --green-rgb:20,154,88; --amber-rgb:191,115,0; --bg-rgb:243,242,239;
  --aur-1b:rgba(80,130,255,.077); --aur-2b:rgba(60,200,200,.056); --aur-3b:rgba(190,150,255,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F3F2EF; --bg-2:#ECEBE7;
  --glass:rgba(255,255,255,.55); --glass-2:rgba(255,255,255,.82); --glass-3:rgba(255,255,255,.95);
  --solid:rgba(250,250,248,.80);
  --hair:rgba(22,24,34,.075); --hair-2:rgba(22,24,34,.13); --hi:rgba(255,255,255,.95);
  --ink:#15171F; --ink-2:#5B6072; --ink-3:#7E8494;
  --accent:#2F63E8; --accent-2:#2554D6; --on-accent:#FFFFFF; --accent-soft:rgba(47,99,232,.10); --accent-line:rgba(47,99,232,.40);
  --green:#149A58; --amber:#BF7300; --red:#D63B3B;
  --spec:rgba(47,99,232,.07);
  --shadow:0 1px 1px rgba(20,24,40,.04),0 8px 24px -14px rgba(20,24,40,.18);
  --lift:0 2px 3px rgba(20,24,40,.05),0 24px 50px -24px rgba(20,24,40,.30);
  --float:0 50px 120px -30px rgba(20,24,40,.35),0 0 0 1px rgba(20,24,40,.05);
  --aur-1:rgba(80,130,255,.22); --aur-2:rgba(60,200,200,.16); --aur-3:rgba(190,150,255,.20);
  --grain:.035; --scrim:rgba(30,32,44,.28);
  --accent-rgb:47,99,232; --green-rgb:20,154,88; --amber-rgb:191,115,0; --bg-rgb:243,242,239;
  --aur-1b:rgba(80,130,255,.077); --aur-2b:rgba(60,200,200,.056); --aur-3b:rgba(190,150,255,.07);
  color-scheme:light;
}}

/* ---------- base ---------- */
*{box-sizing:border-box}
html{overflow-x:clip;scroll-behavior:smooth;background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:.90625rem/1.5 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;min-height:100vh;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
/* touch: no text selection, callouts or double-tap zoom on anything tappable */
button,[role="button"],.sw,.link,.chip,.item,.frow,.pcard,.opt,.tab,.hues button,.seg button,label.remember{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{touch-action:manipulation}
.gone{display:none!important}
#stage{display:contents}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- backdrop: slow aurora + grain ---------- */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 80% at 50% -10%,var(--bg-2),var(--bg) 60%)}
.aurora i{position:absolute;border-radius:50%;will-change:transform;opacity:.95}
.aurora i:nth-child(1){width:58vw;height:58vw;left:-12vw;top:-26vw;background:radial-gradient(closest-side,var(--aur-1),var(--aur-1b) 45%,transparent);animation:aur1 42s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:46vw;height:46vw;right:-14vw;top:-8vw;background:radial-gradient(closest-side,var(--aur-3),var(--aur-3b) 45%,transparent);animation:aur2 54s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:50vw;height:50vw;left:30vw;bottom:-32vw;background:radial-gradient(closest-side,var(--aur-2),var(--aur-2b) 45%,transparent);animation:aur3 48s ease-in-out infinite alternate}
@keyframes aur1{to{transform:translate(14vw,10vw) scale(1.18)}}
@keyframes aur2{to{transform:translate(-12vw,16vw) scale(.88)}}
@keyframes aur3{to{transform:translate(-18vw,-10vw) scale(1.12)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:160px 160px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:12px 28px;transition:background-color var(--d-base) var(--soft),box-shadow var(--d-base) var(--soft),transform .34s var(--out)}
.bar::before{content:"";position:absolute;inset:0;background:rgba(var(--bg-rgb),.55);opacity:0;transition:opacity var(--d-base) var(--soft);pointer-events:none;mask:linear-gradient(#000 70%,transparent);-webkit-mask:linear-gradient(#000 70%,transparent)}
.bar.scrolled::before{opacity:1;backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5)}
.bar>*{position:relative}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:-.02em;color:#fff;background:linear-gradient(145deg,#6E9BFF,#2F55D8 60%,#1A2C7A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px -6px rgba(60,100,255,.7)}
.tabs{display:flex;gap:2px;padding:4px;border-radius:999px;position:relative;background:var(--glass);border:1px solid var(--hair);box-shadow:inset 0 1px 0 var(--hi),var(--shadow);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.tab{position:relative;z-index:1;height:34px;padding:0 16px;-webkit-user-select:none;user-select:none;border-radius:999px;color:var(--ink-2);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:7px;transition:color var(--d-base) var(--soft),transform var(--d-fast) var(--spring)}
@media (hover:hover) and (pointer:fine){.tab:hover{color:var(--ink)}}
.tab:active{transform:scale(.96)}
.tab.on{color:var(--ink)}
.tab .ti{display:none}
.tab-ind{position:absolute;top:4px;height:34px;border-radius:999px;background:var(--glass-3);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px rgba(0,0,0,.18),0 0 0 1px var(--hair);transition:left .42s var(--spring),width .42s var(--spring);will-change:left,width}
.tab-ind.stretch{transition:left .18s var(--out),width .18s var(--out)}
.count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:inline-grid;place-items:center;animation:pop .5s var(--spring) both}
.count.warn{background:var(--amber);color:#1A1000}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.bar-r{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.status{display:flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--hair);font-size:12.5px;color:var(--ink-2);background:var(--glass);box-shadow:inset 0 1px 0 var(--hi)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--green);position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 2.4s var(--out) infinite}
.pulse.amber{background:var(--amber)}
.pulse.red{background:var(--red)}
.status.off{color:var(--red);border-color:rgba(255,123,123,.35)}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.8);opacity:0}}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);transition:background var(--d-fast) var(--soft),color var(--d-fast) var(--soft),transform var(--d-fast) var(--spring)}
@media (hover:hover) and (pointer:fine){.icon-btn:hover{background:var(--glass-2);color:var(--ink)}}
.icon-btn:active{transform:scale(.92)}

/* ---------- page ---------- */
main{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:36px 28px 140px;transform-origin:50% 0;transition:transform var(--d-sheet) var(--out),filter var(--d-sheet) var(--out)}
html.depth main{transform:scale(.985)}
.view{position:relative}
.view.leaving{position:absolute;left:0;right:0;top:0;pointer-events:none;animation:leave .26s var(--in) both}
.leaving .rv,.leaving .ri{animation:none}
@keyframes leave{to{opacity:0;transform:translateY(-10px) scale(.992)}}
/* staggered reveals: sections (.rv) then rows inside them (.ri) */
.rv{animation:rise var(--d-slow) var(--out) both;animation-delay:calc(var(--i,0)*50ms)}
.ri{animation:rise .55s var(--out) both;animation-delay:calc(var(--i,0)*50ms + var(--j,0)*28ms + 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.still .rv,.still .ri{animation:none}
.eyebrow{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
h1{font-size:44px;line-height:1.04;font-weight:600;letter-spacing:-.035em;margin:0}
h1 em{font-family:var(--serif);font-weight:400;font-size:1.14em;letter-spacing:-.01em;font-style:italic}
.lede{font-size:16px;color:var(--ink-2);margin:12px 0 0;max-width:620px;line-height:1.55}
.lede b{color:var(--ink);font-weight:500}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-h h1{font-size:34px}
.page-h .lede{font-size:15px;margin-top:8px}
.page-h .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.section-t{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 6px 12px}
.section-t a,.link{color:var(--ink-3);text-decoration:none;font-weight:500;font-size:12.5px;letter-spacing:0;text-transform:none;transition:color var(--d-fast);cursor:pointer}
@media (hover:hover) and (pointer:fine){.section-t a:hover,.link:hover{color:var(--ink)}}
.subtle{font-size:13px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start;margin-top:16px}
.subtle svg{margin-top:3px}.subtle span{min-width:0}
.subtle code{font-size:12px;background:var(--glass-2);padding:1px 7px;border-radius:6px;border:1px solid var(--hair)}

/* ---------- glass card material ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--glass-2),var(--glass) 40%);border:1px solid var(--hair);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 var(--hi),var(--shadow);overflow:clip}
.tilt{transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));transition:transform .7s var(--spring),box-shadow .5s var(--soft);will-change:transform}
.tilt.tracking{transition:transform .14s linear,box-shadow .5s var(--soft)}
@media (hover:hover){.tilt:hover{--ty:-3px;box-shadow:inset 0 1px 0 var(--hi),var(--lift);z-index:1}}
.spec{position:absolute;left:0;top:0;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:radial-gradient(closest-side,var(--spec),transparent);transform:translate(var(--mx,0px),var(--my,0px));opacity:0;transition:opacity .4s var(--soft);pointer-events:none;z-index:-1}
.tracking .spec{opacity:1}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--hair-2),transparent)}

/* ---------- buttons ---------- */
.btn{height:38px;padding:0 15px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13.5px;border:1px solid var(--hair-2);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--hi);transition:background var(--d-fast) var(--soft),transform var(--d-fast) var(--spring),box-shadow var(--d-base) var(--soft),border-color var(--d-fast);white-space:nowrap}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--glass-3);transform:translateY(-1px)}}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:transparent;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
@media (hover:hover) and (pointer:fine){.btn.primary:hover{background:var(--ink);filter:brightness(1.08)}}
.btn.accent{background:linear-gradient(180deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 28px -10px var(--accent)}
@media (hover:hover) and (pointer:fine){.btn.accent:hover{background:linear-gradient(180deg,var(--accent),var(--accent-2));filter:brightness(1.06)}}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);box-shadow:none}
@media (hover:hover) and (pointer:fine){.btn.quiet:hover{background:var(--glass-2);color:var(--ink)}}
.btn.sm{height:31px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
kbd{font:500 11px var(--sans);padding:2px 6px;border-radius:6px;border:1px solid var(--hair-2);color:var(--ink-3);background:var(--glass)}

/* ---------- ask bar (floating console under the stage) ---------- */
.ask{position:relative;z-index:3;margin:-32px auto 14px;width:min(780px,100%);display:flex;align-items:center;gap:14px;height:64px;padding:0 10px 0 12px;border-radius:999px;background:var(--solid);border:1px solid var(--hair-2);box-shadow:inset 0 1px 0 var(--hi),var(--lift);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);transition:box-shadow var(--d-base) var(--soft),border-color var(--d-base) var(--soft),transform var(--d-base) var(--out)}
.ask:focus-within{border-color:var(--accent-line);box-shadow:inset 0 1px 0 var(--hi),var(--lift),0 0 0 5px var(--accent-soft);transform:translateY(-1px)}
.ask input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0;-webkit-appearance:none;appearance:none;border-radius:0}
.ask input::placeholder{color:var(--ink-3)}
.ask .orb{width:40px;height:40px}
.ask-mic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);transition:transform var(--d-base) var(--spring),box-shadow var(--d-base)}
@media (hover:hover) and (pointer:fine){.ask-mic:hover{transform:scale(1.06);box-shadow:0 8px 20px -8px rgba(0,0,0,.6)}}
.ask-mic:active{transform:scale(.95)}
.ask-mic svg{width:18px;height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 40px}
.chip{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--hair);background:var(--glass);font-size:13px;color:var(--ink-2);transition:all var(--d-fast) var(--soft),transform var(--d-fast) var(--spring)}
@media (hover:hover) and (pointer:fine){.chip:hover{color:var(--ink);border-color:var(--hair-2);background:var(--glass-2);transform:translateY(-1px)}}
.chip:active{transform:scale(.96)}

/* ---------- small gradient orb (fab, chat, ask) ---------- */
.orb{position:relative;border-radius:50%;flex:none;overflow:hidden;isolation:isolate;
  background:radial-gradient(circle at 32% 28%,#EAF2FF 0,#9DBDFF 16%,#4B7BFF 42%,#2A4BD8 66%,#121E5C 100%);
  box-shadow:inset 0 -6px 14px rgba(8,16,60,.45),inset 0 4px 10px rgba(255,255,255,.35)}
.orb i{position:absolute;border-radius:50%;filter:blur(6px);mix-blend-mode:screen;opacity:.85}
.orb i:nth-child(1){width:70%;height:70%;left:-10%;top:30%;background:#5EEAD4;animation:drift 9s ease-in-out infinite}
.orb i:nth-child(2){width:60%;height:60%;right:-12%;top:-8%;background:#A78BFA;animation:drift 11s ease-in-out infinite reverse}
.orb i:nth-child(3){width:45%;height:45%;left:30%;bottom:-15%;background:#60A5FA;animation:drift 7s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(18%,-12%) scale(1.15)}66%{transform:translate(-12%,10%) scale(.9)}}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.75),transparent 28%)}
.orb canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.orb.live{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.04)}}

/* ---------- today ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.grid>*{min-width:0}
.stack{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.stack>*,section{min-width:0}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}
.metric{padding:22px 24px 20px;position:relative}
.metric+.metric::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:1px;background:linear-gradient(180deg,transparent,var(--hair-2),transparent)}
.metric .v{font-size:36px;font-weight:500;letter-spacing:-.045em;line-height:1.05}
.metric .l{font-size:12.5px;color:var(--ink-3);margin-top:6px;font-weight:500}
.metric.hl .v{color:var(--accent)}
.metric.warn .v{color:var(--amber)}
.metric svg.spark{position:absolute;right:20px;top:24px;opacity:.9}
.list{padding:6px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;transition:background var(--d-fast) var(--soft),transform var(--d-fast) var(--spring);cursor:pointer;text-align:left;width:100%;position:relative}
@media (hover:hover) and (pointer:fine){.item:hover{background:var(--glass-2)}}
.item:active{transform:scale(.995)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .s{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .r{font-size:12.5px;color:var(--ink-3);flex:none}
.item.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.30)}
.item.sel::before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-weight:500;font-size:15px;margin-bottom:2px}
.timeline{padding:20px 22px 10px;position:relative}
.tl{display:grid;grid-template-columns:48px 14px 1fr;gap:10px;padding-bottom:16px;font-size:13.5px;position:relative}
.tl .when{color:var(--ink-3);font-size:12px;text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.tl .node{position:relative}
.tl .node::before{content:"";position:absolute;left:6px;top:14px;bottom:-16px;width:1px;background:var(--hair-2)}
.tl:last-child .node::before{display:none}
.tl .node span{position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 3px var(--bg),0 0 10px 1px currentColor}
.tl .txt{color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.tl .txt b{color:var(--ink);font-weight:500}

/* ---------- avatars, people ---------- */
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;letter-spacing:-.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 8px rgba(0,0,0,.22),0 0 0 1px rgba(255,255,255,.06)}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:30%;height:30%;min-width:9px;min-height:9px;border-radius:50%;border:2px solid var(--bg);background:var(--ink-3)}
.av .dot.on{background:var(--green)}
.av.busy::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--green);animation:halo 2s var(--out) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}
.person{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;transition:background var(--d-fast) var(--soft)}
@media (hover:hover) and (pointer:fine){.person:hover{background:var(--glass-2)}}
.person .main{flex:1;min-width:0;cursor:pointer}
.person .t{font-weight:500}
.person .s{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pcard{padding:24px;display:flex;flex-direction:column;gap:18px;cursor:pointer;text-align:left;min-height:210px;transition:transform .7s var(--spring),box-shadow .5s var(--soft),opacity .3s var(--soft)}
.pcard.off{opacity:.55;filter:saturate(.4)}
.pcard .top{display:flex;align-items:flex-start;gap:14px}
.pcard .nm{font-size:16px;font-weight:600;letter-spacing:-.02em}
.pcard .ti{font-size:13px;color:var(--ink-3)}
.pcard .now{font-size:13.5px;color:var(--ink-2);line-height:1.5;flex:1}
.pcard .meta{display:flex;gap:18px;font-size:12.5px;color:var(--ink-3);padding-top:14px;position:relative}
.pcard .meta::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,var(--hair-2),transparent)}
.pcard .meta b{color:var(--ink);font-weight:500}
.hire{border:1px dashed var(--hair-2);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--ink-3);gap:10px}
@media (hover:hover) and (pointer:fine){.hire:hover{color:var(--ink);border-color:var(--ink-3);box-shadow:none}}
.hire .plus{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair-2);display:grid;place-items:center;background:var(--glass)}

/* switch */
.sw{position:relative;width:40px;height:23px;flex:none;margin-left:auto}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--hair-2);box-shadow:inset 0 1px 2px rgba(0,0,0,.2);transition:background .3s var(--soft)}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.12);transition:transform .38s var(--spring)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(17px)}
.sw input:active+span::after{transform:scaleX(1.15)}
.sw input:checked:active+span::after{transform:translateX(15px) scaleX(1.15)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- approvals ---------- */
.reader{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
.reader>*{min-width:0}
.queue{padding:6px;position:sticky;top:84px}
.paper{overflow:clip}
.paper.swap{animation:swap .4s var(--out) both}
@keyframes swap{from{opacity:0;transform:translateX(12px)}}
.paper-h{padding:28px 32px 0}
.by{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3)}
.by b{color:var(--ink);font-weight:500}
.subj{font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.3;margin:16px 0 12px}
.to{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-3)}
.tag{height:24px;padding:0 9px;border-radius:7px;background:var(--glass-2);border:1px solid var(--hair);color:var(--ink-2);font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.note{margin:18px 32px 0;padding:12px 14px;border-radius:12px;background:var(--glass-2);border:1px solid var(--hair);font-size:13px;color:var(--ink-2);display:flex;gap:10px}
.note svg{color:var(--amber);margin-top:2px}
.letter{padding:26px 32px 30px;font-size:15px;line-height:1.7;color:var(--ink)}
.letter p{margin:0 0 14px}
.letter ul,.letter ol{margin:0 0 14px;padding-left:20px}
.letter strong{font-weight:600}
.extras{font-size:12.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;padding-top:6px}
.decide{display:flex;gap:10px;align-items:center;padding:16px 20px 16px 32px;border-top:1px solid var(--hair);background:var(--glass)}
.decide .hint{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}

/* ---------- files ---------- */
.search{position:relative}
.search input{height:38px;width:250px;border-radius:12px;border:1px solid var(--hair);background:var(--glass);box-shadow:inset 0 1px 0 var(--hi);padding:0 12px 0 36px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color var(--d-fast),box-shadow var(--d-fast),width var(--d-base) var(--out)}
.search input:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:11px;color:var(--ink-3)}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--glass);border:1px solid var(--hair);position:relative}
.seg button{height:30px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--ink-2);font-weight:500;transition:color var(--d-fast),background var(--d-base) var(--soft)}
.seg button.on{background:var(--glass-3);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px rgba(0,0,0,.15),0 0 0 1px var(--hair)}
.frow{display:grid;grid-template-columns:minmax(0,1.1fr) 150px minmax(0,2fr) 90px 80px;gap:18px;align-items:center;padding:16px 22px;cursor:pointer;transition:background var(--d-fast) var(--soft);position:relative}
.fhead{display:grid;grid-template-columns:minmax(0,1.1fr) 150px minmax(0,2fr) 90px 80px;gap:18px;padding:12px 22px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;border-bottom:1px solid var(--hair)}
.fhead span:last-child{text-align:right}
@media (max-width:980px){.fhead{display:none}}
.frow+.frow::before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:var(--hair)}
@media (hover:hover) and (pointer:fine){.frow:hover{background:var(--glass-2)}}
.frow .c b{display:block;font-weight:500}
.frow .c span,.frow .w{font-size:12.5px;color:var(--ink-3)}
.frow .sum{font-size:13.5px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.state{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.state i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);box-shadow:0 0 8px currentColor;color:transparent}
.state.owe i{background:var(--red);color:var(--red)}.state.wait i{background:var(--amber);color:var(--amber)}.state.draft i{background:var(--accent);color:var(--accent)}
.ladder{display:flex;gap:3px}
.ladder i{width:12px;height:4px;border-radius:2px;background:var(--hair-2)}
.ladder i.on{background:var(--amber);box-shadow:0 0 6px rgba(var(--amber-rgb),.60)}

/* ---------- sheet / modal (depth) ---------- */
.scrim{position:fixed;inset:0;z-index:60;touch-action:none;background:var(--scrim);backdrop-filter:blur(10px) saturate(.9);-webkit-backdrop-filter:blur(10px) saturate(.9);opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--d-sheet) var(--soft),visibility var(--d-sheet)}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto}
.sheet{position:fixed;z-index:61;top:10px;right:10px;bottom:10px;width:min(480px,calc(100vw - 20px));background:var(--solid);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--hair-2);border-radius:var(--r-xl);box-shadow:inset 0 1px 0 var(--hi),var(--float);display:flex;flex-direction:column;transform:translateX(calc(100% + 40px)) scale(.98);opacity:0;transition:transform var(--d-sheet) var(--spring),opacity .3s var(--soft),width .3s var(--out);visibility:hidden;transition-property:transform,opacity,width,visibility}
.sheet.on{transform:none;opacity:1;visibility:visible}
.sheet.wide{width:min(860px,calc(100vw - 20px))}
.sheet-h{display:flex;align-items:center;gap:14px;padding:20px 22px;border-bottom:1px solid var(--hair)}
.sheet-h .t{font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheet-h .s{font-size:13px;color:var(--ink-3)}
.sheet-b{flex:1;overflow:auto;padding:22px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.blk{margin-bottom:28px}
.sheet.fresh .blk{animation:rise .5s var(--out) both;animation-delay:calc(var(--j,0)*45ms + 120ms)}
.blk>h4{margin:0 0 10px;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.in{width:100%;border:1px solid var(--hair);background:var(--glass);box-shadow:inset 0 1px 0 var(--hi);border-radius:12px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none;transition:border-color var(--d-fast),box-shadow var(--d-fast),background var(--d-fast);color:var(--ink)}
.in::placeholder{color:var(--ink-3)}
.in:focus{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft);background:var(--glass-2)}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select.in option{background:var(--bg);color:var(--ink)}
textarea.in{min-height:92px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{padding:14px 0;border-top:1px solid var(--hair)}
.task:first-child{border-top:0;padding-top:0}
.task .t{font-weight:500;display:flex;gap:10px;align-items:baseline}
.task .t span{margin-left:auto}
.task .s{font-size:13px;color:var(--ink-2);margin-top:4px}
.badge{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--glass-2);color:var(--ink-2);border:1px solid var(--hair);white-space:nowrap}
.badge.done{color:var(--green)}.badge.running{color:var(--accent)}.badge.failed{color:var(--red)}
.result{margin-top:10px;padding:14px;border-radius:12px;background:var(--glass);font-size:13.5px;line-height:1.6;border:1px solid var(--hair);animation:rise .35s var(--out) both}
.result h3{font-size:14px;margin:6px 0}
.result table{border-collapse:collapse}.result td,.result th{border:1px solid var(--hair-2);padding:4px 8px}
.helpers{display:flex;flex-wrap:wrap;gap:6px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.hues{display:flex;gap:10px}
.hues button{width:28px;height:28px;border-radius:50%;transition:transform var(--d-base) var(--spring);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
@media (hover:hover) and (pointer:fine){.hues button:hover{transform:scale(1.12)}}
.hues button.sel{outline:2px solid var(--ink);outline-offset:3px;transform:scale(1.08)}
iframe.rep{width:100%;flex:1;border:0;border-radius:0 0 var(--r-xl) var(--r-xl);background:#fff;min-height:0}
.rep-wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.rep-wrap iframe.rep{flex:1;height:100%}
.modal{position:fixed;z-index:62;left:50%;top:50%;width:min(520px,calc(100vw - 32px));max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;visibility:hidden;background:var(--solid);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--hair-2);border-radius:var(--r-xl);box-shadow:inset 0 1px 0 var(--hi),var(--float);padding:28px;transition:transform .5s var(--spring),opacity .3s var(--soft),visibility .5s}
.modal.on{opacity:1;pointer-events:auto;visibility:visible;transform:translate(-50%,-50%)}
.modal h3{margin:0;font-size:21px;letter-spacing:-.025em;font-weight:600}
.modal .sub{color:var(--ink-3);margin:6px 0 20px;font-size:14px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ---------- assistant ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:50;width:56px;height:56px;border-radius:50%;box-shadow:0 14px 34px -8px rgba(60,110,255,.6);transition:transform .45s var(--spring),opacity .3s var(--soft)}
@media (hover:hover) and (pointer:fine){.fab:hover{transform:scale(1.08)}}
.fab:active{transform:scale(.96)}
.fab .orb{width:100%;height:100%}
.fab.hidden{opacity:0;transform:scale(.5);pointer-events:none}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:86%;font-size:14.5px;line-height:1.6;animation:msgIn .45s var(--spring) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:18px 18px 6px 18px;white-space:pre-wrap;transform-origin:100% 100%}
.msg.a{align-self:flex-start;color:var(--ink);transform-origin:0 100%}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}.msg.a ul{margin:4px 0 8px;padding-left:18px}
.done-tag{display:inline-flex;align-items:center;gap:6px;margin:8px 6px 0 0;font-size:12.5px;color:var(--green);background:rgba(var(--green-rgb),.12);padding:4px 10px;border-radius:999px}
.dots{display:inline-flex;gap:4px;padding:6px 0}.dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1.2s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.composer{padding:14px;border-top:1px solid var(--hair)}
.composer-in{display:flex;align-items:flex-end;gap:8px;padding:6px 6px 6px 14px;border-radius:20px;border:1px solid var(--hair-2);background:var(--glass);box-shadow:inset 0 1px 0 var(--hi);transition:border-color var(--d-fast),box-shadow var(--d-fast)}
.composer-in:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:none;padding:8px 0;max-height:140px;line-height:1.45;color:var(--ink);-webkit-appearance:none;appearance:none;border-radius:0}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;transition:transform var(--d-fast) var(--spring),background var(--d-fast)}
.round.dark{background:var(--ink);color:var(--bg)}
.round.light{color:var(--ink-2)}@media (hover:hover) and (pointer:fine){.round.light:hover{background:var(--glass-2)}}
.round:active{transform:scale(.92)}
.welcome{text-align:center;padding:40px 10px 10px}
.welcome .orb{width:72px;height:72px;margin:0 auto 18px}
.welcome h3{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:600}
.welcome p{color:var(--ink-3);margin:6px auto 20px;max-width:300px}
.welcome .chips{justify-content:center;margin:0}

/* ---------- voice overlay ---------- */
.voice{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:rgba(var(--bg-rgb),.76);backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);opacity:0;pointer-events:none;visibility:hidden;transition:opacity .5s var(--soft),visibility .5s}
.voice.on{opacity:1;pointer-events:auto;visibility:visible}
/* opened from the chat sheet on a desktop: the stage docks to the left of the sheet so the live captions in the chat stay in view */
@media (min-width:761px) and (pointer:fine){.voice.docked{right:var(--dock,500px);transition:opacity .5s var(--soft),visibility .5s,right .3s var(--out)}.voice.docked .v-cap{width:min(640px,100%)}}
.voice>*{transition:transform .7s var(--spring),opacity .4s var(--soft);transform:translateY(18px) scale(.97);opacity:0}
.voice.on>*{transform:none;opacity:1}
.voice.on>:nth-child(2){transition-delay:.04s}.voice.on>:nth-child(3){transition-delay:.1s}.voice.on>:nth-child(4){transition-delay:.16s}.voice.on>:nth-child(5){transition-delay:.22s}
.v-orb{position:relative;width:min(300px,64vw);height:min(300px,64vw);border-radius:50%;cursor:pointer;display:block}
.v-orb canvas{position:absolute;inset:-30%;width:160%;height:160%;display:block}
.v-orb.live{animation:breathe 1.6s ease-in-out infinite}
.v-orb::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--accent-rgb),.55),rgba(var(--accent-rgb),.12) 60%,transparent);filter:blur(26px);animation:haloB 4.5s ease-in-out infinite}
.voice::before{content:"";position:absolute;inset:0;background:radial-gradient(42% 42% at 50% 44%,rgba(var(--accent-rgb),.16),transparent 70%);pointer-events:none;transform:none!important;opacity:1!important}
.v-ring{position:absolute;inset:4%;border-radius:50%;border:1px solid var(--accent-line);opacity:0;pointer-events:none}
.voice[data-state="listening"] .v-ring{animation:vr 2.2s var(--out) infinite}
.voice[data-state="speaking"] .v-ring{animation:vr 1.5s var(--out) infinite}
.voice[data-state="thinking"] .v-ring{opacity:.5;border-style:dashed;animation:spin 6s linear infinite}
.v-ring:nth-child(2){animation-delay:.7s!important}
@keyframes vr{0%{transform:scale(.92);opacity:.65}100%{transform:scale(1.55);opacity:0}}
.v-state{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.voice[data-state="listening"] .v-state{color:var(--green)}
.voice[data-state="speaking"] .v-state{color:var(--accent)}
/* captions: what he said (sans, live words settle as they are confirmed) above what she says (serif, one line per spoken chunk, the current one lit) */
.v-cap{width:min(760px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:110px;justify-content:center}
.cap-user{font-size:22px;line-height:1.4;letter-spacing:-.015em;color:var(--ink-2);max-width:100%;text-wrap:balance;overflow-wrap:anywhere}
.cap-user:empty{display:none}
.cap-user .w{display:inline;transition:opacity .12s var(--soft)}

.cap-user .caret{display:none;width:2px;height:.9em;background:var(--accent);vertical-align:-2px;margin-left:3px;animation:bl 1s steps(1) infinite}

.cap-list{list-style:none;margin:0;padding:0 6px;display:flex;flex-direction:column;gap:4px;width:100%;max-height:36vh;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;mask:linear-gradient(transparent,#000 10%,#000 90%,transparent);-webkit-mask:linear-gradient(transparent,#000 10%,#000 90%,transparent)}
.cap-list::-webkit-scrollbar{display:none}
.cap-list:empty{display:none}
.cap-list li{font-family:var(--serif);font-size:29px;line-height:1.3;letter-spacing:-.005em;color:var(--ink);opacity:.32;position:relative;padding:4px 0 8px;text-wrap:balance;overflow-wrap:anywhere;transition:opacity .35s var(--soft)}
.cap-list li.now{opacity:1}
.cap-list li.done{opacity:.68}
.cap-list li.cut{opacity:.35;text-decoration:line-through;text-decoration-color:var(--ink-3)}
.cap-list li.now::after{content:"";position:absolute;left:50%;bottom:2px;width:min(180px,60%);height:2px;border-radius:2px;background:var(--accent);transform:translateX(-50%) scaleX(var(--p,0));transform-origin:50% 50%;transition:transform .1s linear}
.cap-cue{font-size:14px;color:var(--ink-3);max-width:560px;line-height:1.45;text-wrap:balance}
.cap-cue:empty{display:none}
.cap-cue.warn{color:var(--amber)}
.cap-follow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0}
.cap-follow:empty{display:none}
.v-strip{list-style:none;margin:0;padding:0;width:min(760px,100%);display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--ink-3);max-height:92px;overflow:hidden}
.v-strip:empty{display:none}
.v-strip li{display:flex;gap:10px;justify-content:center;align-items:baseline;opacity:.55;min-width:0;max-width:100%}
.v-strip li:last-child{opacity:1}
.v-strip .u,.v-strip .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:48%}

@media (hover:hover) and (pointer:fine){.v-strip .a:hover{color:var(--ink)}}

/* the same captions inside the chat sheet while voice is on */
.msg.a .cap-list{max-height:none;mask:none;-webkit-mask:none;gap:2px;padding:0}
.msg.a .cap-list li{font-family:var(--sans);font-size:14.5px;line-height:1.6;letter-spacing:-.006em;padding:0 0 3px;text-wrap:initial;opacity:.45}
.msg.a .cap-list li.now{opacity:1}.msg.a .cap-list li.done{opacity:.8}
.msg.a .cap-list li.now::after{left:0;transform:scaleX(var(--p,0));transform-origin:0 50%;width:60px;bottom:0}
.msg.u.live{opacity:.6}
.chips.follow{margin:8px 0 0;justify-content:flex-start}
.chips.follow .chip{height:28px;font-size:12.5px}
.ai-off{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);padding:6px 12px;border-radius:999px;border:1px dashed var(--hair-2);margin:-28px auto 20px;position:relative;z-index:3}

.chips.dim .chip{opacity:.55}
.v-ctl{display:flex;gap:10px;align-items:center}
.v-ctl .round{width:50px;height:50px;border:1px solid var(--hair-2);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--hi)}
@media (hover:hover) and (pointer:fine){.v-ctl .round:hover{background:var(--glass-3)}}

.v-ctl .round svg{width:18px;height:18px}
.v-end{background:var(--red)!important;color:#fff!important;border-color:transparent!important;box-shadow:0 10px 24px -10px var(--red)!important}

/* ---------- command deck: widescreen cinematic stage ---------- */
.deck{position:relative;overflow:hidden;border-radius:var(--r-xl);min-height:500px;display:flex;flex-direction:column;isolation:isolate;color:#DCE6F5;background:#070910;border:1px solid rgba(140,180,255,.14);box-shadow:0 50px 120px -40px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.08);--px:0;--py:0;margin-top:28px}
.deck .bgl{position:absolute;inset:0;pointer-events:none;transition:transform .25s linear}
.deck .bgl.a{background:radial-gradient(55% 48% at 50% 30%,rgba(70,120,255,.34),transparent 70%),radial-gradient(70% 36% at 50% 104%,rgba(80,160,255,.20),transparent 70%),linear-gradient(180deg,#0C1324 0%,#070A13 55%,#05070C 100%);transform:translate(calc(var(--px)*6px),calc(var(--py)*4px)) scale(1.04)}
.deck .bgl.g{top:41%;bottom:-8%;left:-30%;right:-30%;background:linear-gradient(rgba(150,195,255,.075) 1px,transparent 1px) 0 0/100% 30px,linear-gradient(90deg,rgba(150,195,255,.075) 1px,transparent 1px) 0 0/62px 100%;transform:perspective(700px) rotateX(64deg) translate(calc(var(--px)*-14px),0);transform-origin:50% 0;mask:linear-gradient(180deg,transparent,#000 22%,#000 70%,transparent);-webkit-mask:linear-gradient(180deg,transparent,#000 22%,#000 70%,transparent)}
.deck .bgl.h{top:41%;height:1px;left:6%;right:6%;background:linear-gradient(90deg,transparent,rgba(160,205,255,.55) 50%,transparent)}
.deck .bgl.h::after{content:"";position:absolute;left:25%;right:25%;top:-22px;height:44px;background:radial-gradient(50% 50% at 50% 50%,rgba(120,180,255,.28),transparent 70%);filter:blur(10px)}
.deck .bgl.v{background:radial-gradient(85% 85% at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%)}
.deck .brk{position:absolute;z-index:3;width:12px;height:12px;border:1px solid rgba(155,216,255,.38);pointer-events:none}
.deck .brk.tl{left:16px;top:16px;border-right:0;border-bottom:0}.deck .brk.tr{right:16px;top:16px;border-left:0;border-bottom:0}
.deck .brk.bl{left:16px;bottom:16px;border-right:0;border-top:0}.deck .brk.br{right:16px;bottom:16px;border-left:0;border-top:0}
.hud{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:20px 36px 0;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(165,200,255,.58);font-weight:600;white-space:nowrap;min-width:0}
.hud .sp{flex:1}
.hud .sep{width:1px;height:10px;background:rgba(165,200,255,.28);flex:none}
.hud .live{width:6px;height:6px;border-radius:50%;background:#3EE0A6;box-shadow:0 0 0 0 rgba(62,224,166,.6);animation:livep 2.2s infinite;flex:none}
.hud #deckState{color:#9BD8FF;min-width:0;overflow:hidden;text-overflow:ellipsis}
@keyframes livep{70%{box-shadow:0 0 0 9px rgba(62,224,166,0)}100%{box-shadow:0 0 0 0 rgba(62,224,166,0)}}
.stage{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px 14px;gap:12px;min-width:0}
.deck-orb{position:relative;width:228px;height:228px;cursor:pointer;display:grid;place-items:center;transform:translate(calc(var(--px)*-7px),calc(var(--py)*-5px));transition:transform .25s linear;flex:none;border-radius:50%}
.deck-orb canvas{position:absolute;inset:-22%;width:144%;height:144%;display:block}
.deck-orb .halo{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(120,170,255,.5),rgba(120,170,255,.1) 60%,transparent);filter:blur(20px);animation:haloB 4.5s ease-in-out infinite}
@keyframes haloB{50%{transform:scale(1.16);opacity:.7}}
.deck-orb .ring{position:absolute;inset:-4%;border-radius:50%;border:1px solid rgba(160,205,255,.16);mask:conic-gradient(from 0deg,#000 0 28%,transparent 28% 50%,#000 50% 78%,transparent 78%);-webkit-mask:conic-gradient(from 0deg,#000 0 28%,transparent 28% 50%,#000 50% 78%,transparent 78%);animation:spin 30s linear infinite}
.deck-orb .ring.r2{inset:-11%;border-color:rgba(160,205,255,.09);animation-duration:48s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.deck-say{font-family:var(--serif);font-size:30px;line-height:1.3;letter-spacing:-.005em;color:#F2F6FB;max-width:760px;min-height:78px;text-wrap:balance;margin-top:-6px}
.deck-say .cur{display:inline-block;width:2px;height:.85em;background:#9BD8FF;vertical-align:-3px;margin-left:3px;animation:bl 1s infinite}
.deck-now{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(220,232,245,.66);max-width:100%;min-height:22px;min-width:0}
.deck-now .who{color:#9BD8FF;font-weight:600;flex:none}
.deck-now .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.deck-now .k{flex:none;font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.14em;color:rgba(155,216,255,.5);text-transform:uppercase}
.deck-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.deck .btn{background:rgba(140,185,255,.08);border-color:rgba(140,185,255,.22);color:#DCE8F5;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
@media (hover:hover) and (pointer:fine){.deck .btn:hover{background:rgba(140,185,255,.16)}}
.deck .btn.glow{background:linear-gradient(180deg,#C3E3FF,#8EC6FF);color:#06101F;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 32px -8px rgba(140,200,255,.9)}
@media (hover:hover) and (pointer:fine){.deck .btn.glow:hover{filter:brightness(1.05);background:linear-gradient(180deg,#C3E3FF,#8EC6FF)}}
.readout{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);padding:18px 36px 60px;gap:12px}
.readout::before{content:"";position:absolute;left:36px;right:36px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(165,200,255,.24),transparent)}
.readout div{display:flex;align-items:baseline;gap:10px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(165,200,255,.52);font-weight:600;justify-content:center;white-space:nowrap}
.readout b{font:500 21px/1 var(--sans);letter-spacing:-.03em;color:#EEF3FB}
.readout b.hl{color:#9BD8FF;text-shadow:0 0 18px rgba(155,216,255,.6)}.readout b.warn{color:#FFB648;text-shadow:0 0 18px rgba(255,182,72,.5)}

/* ---------- logic ---------- */
.dcard{padding:26px 28px;display:grid;gap:16px}
.dcard::before{content:"";position:absolute;inset:0;background:radial-gradient(42% 60% at 0% 0%,rgba(var(--amber-rgb),.13),transparent 70%);pointer-events:none}
.dcard>*{position:relative}
.dcard .ask-by{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.dcard .ask-by b{color:var(--ink);font-weight:500}
.dcard .flag{display:inline-flex;align-items:center;gap:6px;color:var(--amber);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-left:auto}
.dcard .sit{font-size:17px;line-height:1.5;letter-spacing:-.015em;max-width:72ch}
.dcard .opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--hair);background:var(--glass);transition:border-color var(--d-fast) var(--soft),background var(--d-fast) var(--soft),box-shadow var(--d-base) var(--soft),transform var(--d-fast) var(--spring);font-size:14px;line-height:1.45}
@media (hover:hover) and (pointer:fine){.opt:hover{border-color:var(--hair-2);background:var(--glass-2)}}
.opt:active{transform:scale(.995)}
.opt.sel{border-color:var(--accent-line);background:var(--accent-soft);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.08)}
.opt .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--hair-2);display:grid;place-items:center;font-size:11.5px;font-weight:600;color:var(--ink-3);flex:none;transition:all var(--d-base) var(--spring)}
.opt.sel .n{background:var(--accent);color:var(--on-accent);border-color:transparent;transform:scale(1.1)}
.dcard .risk{font-size:13px;color:var(--ink-2)}
.dcard .risk b{color:var(--amber);font-weight:500}
.remember{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.remember input{width:16px;height:16px;accent-color:var(--accent)}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:18px 24px;align-items:start;position:relative;transition:opacity .3s var(--soft)}
.rule+.rule::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:var(--hair)}
.rule .w{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rule .w+div{margin:3px 0 10px;font-weight:500}
.rule .d{color:var(--ink-2);line-height:1.55}
.rule .src{font-size:11.5px;color:var(--ink-3);margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule.off{opacity:.5}
.rule .ctl{display:flex;gap:4px;align-items:center}
.src-tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--hair-2)}
.src-tag.learned{color:var(--green);border-color:rgba(var(--green-rgb),.40)}
.addrule{padding:20px 24px;display:grid;gap:10px;grid-template-columns:1fr 1fr auto;align-items:end}
.addrule .field{margin:0}
.spoken-hint{font-size:12.5px;color:var(--ink-3);margin:8px 6px 0}

/* ---------- toast / skeleton ---------- */
.toasts{position:fixed;left:50%;bottom:28px;z-index:90;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;max-width:90vw;width:max-content}
.toast{transform:translateY(26px) scale(.94);opacity:0;transition:transform .6s var(--spring),opacity .3s var(--soft);background:var(--solid);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);color:var(--ink);border:1px solid var(--hair-2);padding:11px 16px;border-radius:14px;font-weight:500;font-size:13.5px;box-shadow:inset 0 1px 0 var(--hi),var(--float);display:flex;gap:9px;align-items:center;max-width:90vw;pointer-events:auto}
.toast.on{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(10px) scale(.96);transition:transform .3s var(--in),opacity .25s var(--soft)}
.toast svg{color:var(--green)}
.skel{display:grid;gap:22px;padding-top:30px}
.sk{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--hair);border-radius:var(--r-lg)}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,var(--hi) 50%,transparent 70%);transform:translateX(-100%);animation:shimmer 1.6s var(--soft) infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk.h{height:44px;width:42%;border-radius:12px}.sk.big{height:480px;border-radius:var(--r-xl)}.sk.row{height:96px}

/* ---------- theme crossfade ---------- */
.theming *,.theming *::before,.theming *::after{transition:background-color .5s var(--soft),color .5s var(--soft),border-color .5s var(--soft),box-shadow .5s var(--soft),fill .5s var(--soft),stroke .5s var(--soft)!important}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .readout{grid-template-columns:repeat(2,1fr)}
  .addrule{grid-template-columns:1fr}
  .grid,.reader{grid-template-columns:minmax(0,1fr)}
  .queue{position:static}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric:nth-child(3)::before{display:none}
  .metric:nth-child(n+3){border-top:1px solid var(--hair)}
  .frow{grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
  .frow .sum,.frow .ld,.frow .w{display:none}
}

/* =========================================================
   TOUCH (iPhone, iPad, Android): hit targets, 16px fields, press feedback, no tilt
   ========================================================= */
/* any touch screen (incl. an iPad on the desktop layout, where the media queries can miss): fields never zoom, targets never under 44px */
html.touch input,html.touch select,html.touch textarea,html.touch .in,html.touch .search input{font-size:16px!important}
html.touch .btn,html.touch .chip,html.touch .seg button{min-height:44px}
html.touch .sw{width:48px;height:44px} html.touch .sw span{inset:auto;top:50%;left:4px;width:40px;height:23px;margin-top:-11.5px} html.touch .sw input{inset:-11px -8px}
/* hold to send (touch screens): the ring that fills while Approve is held */
.hold{position:relative;display:inline-flex;touch-action:none;border-radius:16px}
.hold .btn{position:relative;z-index:1;transition:transform .9s var(--out),filter .2s}
.hold.holding .btn{transform:scale(.96);filter:brightness(1.08)}
.hold-ring{position:absolute;inset:-6px;border-radius:18px;padding:3px;pointer-events:none;background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),transparent 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .15s var(--soft)}
.hold.holding .hold-ring{opacity:1}
.hold.sent .btn{transform:scale(1.02)}
.hold-hint{font-size:12px;color:var(--ink-3);margin-left:auto}

@media (pointer:coarse),(hover:none){
  input,select,textarea,.in,.search input,.composer textarea,.v-opt select,.ask input,#fileQ{font-size:16px!important}
  .search input{height:44px}
  .btn{min-height:44px} .btn.sm{min-height:40px} .deck-act .btn{min-height:44px}
  .icon-btn,.round{width:44px;height:44px}
  .chip{min-height:44px;padding:0 15px}
  .seg button{min-height:44px}
  .hues button{width:36px;height:36px}
  .sw{width:48px;height:44px}
  .sw span{inset:auto;top:50%;left:4px;width:40px;height:23px;margin-top:-11.5px}
  .link{padding:10px 0;display:inline-block}
  .sw input{inset:-11px -8px}
  .remember input{width:22px;height:22px}
  .tilt{transform:none!important;will-change:auto;transition:box-shadow .3s var(--soft)}
  .tilt .spec{display:none}
  .btn:active,.chip:active,.opt:active,.hues button:active,.seg button:active,.pcard:active,.icon-btn:active,.round:active{transform:scale(.96);transition-duration:120ms}
  .item:active,.frow:active,.person .main:active,.tab:active{transform:scale(.985);transition-duration:120ms}
  .frow,.person .main{transition:transform .12s var(--spring),background var(--d-fast) var(--soft)}
  .deck-orb .halo,.v-orb::before{filter:blur(14px)}
  .aurora i:nth-child(3){display:none}
  .deck-orb,.v-orb,.ask-mic,.fab{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
}

/* =========================================================
   PHONE LAYER: an app shell, not a shrunk website.
   Narrow screens, and touch devices turned on their side (iPhone landscape). iPad keeps the desktop chrome.
   ========================================================= */
@media (max-width:760px),((pointer:coarse) and (max-height:500px)){
  :root{--bar-h:calc(48px + env(safe-area-inset-top,0px));--tabs-h:calc(50px + env(safe-area-inset-bottom,0px));--gx:max(16px,env(safe-area-inset-left,0px));--gxr:max(16px,env(safe-area-inset-right,0px));--kb:0px}
  /* the shell: the document never scrolls (so Safari's bars and rubber band stay out of it); <main> is the scroller */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;min-height:0;transition:background-color var(--d-sheet) var(--soft)}
  html.depth body{background:#101219}
  #stage{display:block;position:fixed;inset:0;z-index:2;background:var(--bg);overflow:hidden;contain:paint;transform-origin:50% 0;transition:transform var(--d-sheet) var(--out),border-radius var(--d-sheet) var(--out)}
  #stage.moving{will-change:transform}
  html.depth #stage{transform:translateY(calc(10px + env(safe-area-inset-top,0px)*.5)) scale(.96);border-radius:18px}
  .aurora,.grain{position:absolute}
  main{position:absolute;inset:0;z-index:1;max-width:none;margin:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;transform:none!important;filter:none!important;transition:none;padding:calc(var(--bar-h) + 10px) var(--gxr) calc(var(--tabs-h) + 28px) var(--gx)}
