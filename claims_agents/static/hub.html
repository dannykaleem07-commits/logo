const SR=window.SpeechRecognition||window.webkitSpeechRecognition, canHear=!!SR, canSpeak="speechSynthesis" in window;
let speakOn=ls.get("hub.speak",true), handsFree=ls.get("hub.hands",false), voices=[], speaking=false, listening=false, rec=null, analyser=null, mic=null, energy=0;
function syncVoiceBtns(){ $("#vSpeak").classList.toggle("on",speakOn); $("#vHands").classList.toggle("on",handsFree); }
function vSet(state,text,user){
  $("#vState").textContent=state||(listening?"Listening":speaking?"Speaking":thinking?"Thinking":"Tap to talk");
  $("#voice").dataset.state=listening?"listening":speaking?"speaking":thinking?"thinking":"idle";
  const t=$("#vText"); if(user!==undefined){t.textContent=user;t.classList.add("user")} else if(text!==undefined){t.textContent=text.length>260?text.slice(0,260)+"…":text;t.classList.remove("user")}
}
function openVoice(listen){ if(!canHear){ toast("Voice needs Chrome or Edge on this computer"); return openChat(); } $("#voice").classList.add("on"); $("#fab").classList.add("hidden"); vSet("", ""); syncVoiceBtns(); if(listen) startListening(); }
function closeVoice(){ stopListening(); stopSpeaking(); $("#voice").classList.remove("on"); if(!sheetFor) $("#fab").classList.remove("hidden"); }
$("#vEnd").onclick=closeVoice; $("#vOrb").onclick=()=>listening?stopListening():startListening();
$("#vSpeak").onclick=()=>{speakOn=!speakOn;ls.set("hub.speak",speakOn);syncVoiceBtns();if(!speakOn)stopSpeaking()};
$("#vHands").onclick=()=>{handsFree=!handsFree;ls.set("hub.hands",handsFree);syncVoiceBtns()};
function loadVoices(){
  if(!canSpeak) return; voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const rank=v=>(/natural|neural|online|premium|enhanced/i.test(v.name)?0:4)+(/en-GB/i.test(v.lang)?0:2)+(/libby|sonia|maisie|serena|kate|female/i.test(v.name)?0:1);
  voices.sort((a,b)=>rank(a)-rank(b)); const sel=$("#voiceSel"), saved=ls.get("hub.voice","");
  sel.innerHTML=voices.map(v=>`<option ${v.name===saved?"selected":""}>${h(v.name)}</option>`).join(""); sel.style.display=voices.length?"":"none";
}
if(canSpeak){loadVoices();speechSynthesis.onvoiceschanged=loadVoices} else $("#voiceSel").style.display="none";
$("#voiceSel").onchange=e=>ls.set("hub.voice",e.target.value);
/* ---- speech out: natural voice sentence by sentence (fast start), browser voice as fallback ---- */
let previewVoice=null;
document.addEventListener("click",ev=>{ if(ev.target.id==="sPreview"){ gestured=true; previewVoice=$("#sTts").value; speak(`Hello ${S.director}. This is how I'll sound.`,{replay:true}).finally?.(()=>{}); setTimeout(()=>previewVoice=null,15000); } });
const ttsEl=$("#ttsAudio"); let ttsCtx=null, ttsAn=null, lastSaid="", speakSeq=0;
function clean(t){return t.replace(/\*\*|[#*_`]/g,"").replace(/^\s*[-•]\s*/gm,"").replace(/\s+/g," ").trim()}
function sentences(t){const out=[];let buf="";for(const part of t.split(/(?<=[.!?])\s+(?=[A-Z0-9£"'])/)){buf=buf?buf+" "+part:part;if(buf.length>=40){out.push(buf);buf=""}}if(buf)out.push(buf);return out.length?out:[t]}
function ttsAnalyser(){ if(ttsAn) return ttsAn; try{ ttsCtx=new(window.AudioContext||window.webkitAudioContext)(); const src=ttsCtx.createMediaElementSource(ttsEl); ttsAn=ttsCtx.createAnalyser(); ttsAn.fftSize=256; ttsAn.smoothingTimeConstant=.8; src.connect(ttsAn); ttsAn.connect(ttsCtx.destination);}catch{} return ttsAn; }
function onSpeakStart(){speaking=true;vSet();$("#vOrb").classList.add("live");orbs.forEach(o=>o.set("speaking"))}
function onSpeakEnd(){speaking=false;$("#vOrb").classList.remove("live");vSet();orbs.forEach(o=>o.set(listening?"listening":"idle")); if(handsFree&&$("#voice").classList.contains("on")) setTimeout(startListening,300)}
function stopSpeaking(){ speakSeq++; if(canSpeak) speechSynthesis.cancel(); try{ttsEl.pause();ttsEl.removeAttribute("src");ttsEl.load()}catch{} if(speaking) onSpeakEnd(); }
async function speak(text,{replay=false}={}){
  text=clean(text); if(!text) return; stopSpeaking(); const seq=speakSeq; if(!replay) lastSaid=text;
  if(S?.tts_ready){
    try{
      ttsAnalyser(); if(ttsCtx?.state==="suspended") await ttsCtx.resume();
      const parts=sentences(text);
      const fetches=parts.map(p=>fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:p,voice:previewVoice||undefined})}).then(r=>r.ok?r.blob():null).catch(()=>null));
      onSpeakStart();
      for(const f of fetches){ if(seq!==speakSeq) return; const b=await f; if(!b){ throw new Error("tts"); }
        await new Promise(res=>{ ttsEl.src=URL.createObjectURL(b); ttsEl.onended=ttsEl.onerror=()=>res(); ttsEl.play().catch(()=>res()); }); }
      if(seq===speakSeq) onSpeakEnd(); return;
    }catch{ if(seq!==speakSeq) return; /* fall through to the browser voice */ }
  }
  if(!canSpeak){ onSpeakEnd(); return; }
  const u=new SpeechSynthesisUtterance(text);
  const v=voices.find(v=>v.name===ls.get("hub.voice",""))||voices[0]; if(v){u.voice=v;u.lang=v.lang} u.rate=1.03;
  u.onstart=onSpeakStart; u.onboundary=()=>{energy=1}; u.onend=u.onerror=onSpeakEnd;
  speechSynthesis.speak(u);
}
function audioLevel(){
  let lvl=0; const bins=new Uint8Array(64);
  if(analyser){analyser.getByteFrequencyData(bins);lvl=bins.reduce((a,b)=>a+b,0)/64/255}
  else if(speaking&&ttsAn&&!ttsEl.paused){ttsAn.getByteFrequencyData(bins);lvl=bins.slice(0,24).reduce((a,b)=>a+b,0)/24/255}
  else if(speaking){energy*=.92;lvl=.12+.22*energy}
  return {lvl,bins};
}

/* ---- greeting ---- */
let greetingText="", greeted=false, greetAloud=ls.get("hub.greet",true), announce=ls.get("hub.announce",true), gestured=false;
async function loadGreeting(){
  try{ const g=await api("/api/greeting"); greetingText=g.text; typeInto($("#deckSay"),g.text); if(greetAloud&&!greeted){ greeted=true; sayGreeting(); } }catch{}
}
function typeInto(el,text){ if(!el) return; if(reduced){ el.textContent=text; return; } let i=0; el.innerHTML='<span class="cur"></span>'; const step=()=>{ if(!document.contains(el)) return; i+=2; el.innerHTML=h(text.slice(0,i))+(i<text.length?'<span class="cur"></span>':""); if(i<text.length) setTimeout(step,14); }; setTimeout(step,420); }
async function sayGreeting(force){
  if(!greetingText) return;
  if(!gestured&&!force){ pendingGreeting=true; return; }  // browsers need a click before audio can play
  speak(greetingText);
}
let pendingGreeting=false;
addEventListener("pointerdown",()=>{ gestured=true; if(pendingGreeting){ pendingGreeting=false; if(greetAloud) speak(greetingText); } },{once:true});

/* ---- proactive announcements: what changed since you last looked ---- */
let seenDrafts=null, seenDecisions=null, seenDone=null, annQueue=[], annTimer=null;
function noteChanges(n){
  const dr=new Set(n.drafts.map(d=>d.id)), de=new Set(n.decisions.map(d=>d.id)), done=new Set(n.tasks.filter(t=>t.status==="done").map(t=>t.id));
  if(seenDrafts){
    const nd=n.drafts.filter(d=>!seenDrafts.has(d.id)); if(nd.length) annQueue.push(nd.length===1?`${first(emp(nd[0].agent).name)} has a draft for you: ${nd[0].subject}.`:`${nd.length} new drafts are waiting for you.`);
    const nq=n.decisions.filter(d=>!seenDecisions.has(d.id)); if(nq.length) annQueue.push(`${first(emp(nq[0].employee).name)} needs a decision from you${nq.length>1?`, and ${nq.length-1} more`:""}.`);
    const nt=n.tasks.filter(t=>t.status==="done"&&!seenDone.has(t.id)); if(nt.length) annQueue.push(nt.length===1?`${first(emp(nt[0].employee).name)} has finished: ${nt[0].title}.`:`${nt.length} tasks have finished.`);
  }
  seenDrafts=dr; seenDecisions=de; seenDone=done;
  if(annQueue.length){ clearTimeout(annTimer); annTimer=setTimeout(flushAnnouncements,3000); }
}
function flushAnnouncements(){
  if(!annQueue.length) return; if(speaking||listening||thinking){ annTimer=setTimeout(flushAnnouncements,3000); return; }
  const line=annQueue.splice(0,3).join(" "); annQueue=[]; toast(line); if(announce&&gestured&&document.visibilityState==="visible") speak(line);
}

/* ---- particle orb (own implementation): a thin cloud of light that reacts to voice ---- */
const orbs=[];
class Orb{
  constructor(cv,n=640,gain=1){ this.cv=cv; this.c=cv.getContext("2d"); this.n=n; this.gain=gain; this.p=[]; this.v=[];
    for(let i=0;i<n;i++){ const u=Math.random()*2-1, th=Math.random()*Math.PI*2, r=Math.cbrt(Math.random()); const s=Math.sqrt(1-u*u); this.p.push([r*s*Math.cos(th),r*s*Math.sin(th),r*u]); this.v.push([0,0,0]); }
    this.cur={r:1,speed:.2,bright:.5,lines:.15,size:1}; this.tgt={...this.cur}; this.rot=[0,0]; this.energy=0; this.state="idle"; this.t=0; orbs.push(this); }
  set(state){ if(state===this.state) return; this.state=state; this.energy=1;
    this.tgt={idle:{r:1,speed:.2,bright:.5,lines:.15,size:1},listening:{r:.82,speed:.3,bright:.7,lines:.4,size:1.1},thinking:{r:.62,speed:.55,bright:.75,lines:1,size:.9},speaking:{r:.7,speed:.25,bright:.8,lines:.8,size:1.1}}[state]||this.tgt; }
  frame(level,bins,colour){
    const cv=this.cv, r=cv.getBoundingClientRect(); if(!r.width) return; const dpr=Math.min(2,devicePixelRatio||1);
    if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
    const c=this.c,W=cv.width,H=cv.height,R=Math.min(W,H)*(this.gain>1?.42:.36); c.clearRect(0,0,W,H);
    for(const k in this.tgt) this.cur[k]+=(this.tgt[k]-this.cur[k])*.03;
    const slow=reduced?.35:1;
    this.energy*=.985; this.t+=.016*this.cur.speed*slow; this.rot[0]+=(.0025*this.cur.speed+this.energy*.01)*slow; this.rot[1]+=.0012*this.cur.speed*slow;
    const bass=level, radius=this.cur.r*(1+bass*.18)*(1+Math.sin(this.t*2.2)*.012), cx=W/2, cy=H/2, cosY=Math.cos(this.rot[0]),sinY=Math.sin(this.rot[0]),cosX=Math.cos(this.rot[1]),sinX=Math.sin(this.rot[1]);
    const pts=new Array(this.n);
    for(let i=0;i<this.n;i++){ const p=this.p[i], v=this.v[i];
      v[0]+=Math.sin(this.t*1.3+p[1]*4)*.0006*this.cur.speed; v[1]+=Math.cos(this.t*1.1+p[2]*4)*.0006*this.cur.speed; v[2]+=Math.sin(this.t*.9+p[0]*4)*.0006*this.cur.speed;
      const d=Math.hypot(p[0],p[1],p[2])||1, pull=(d-1)*.004; v[0]-=p[0]/d*pull; v[1]-=p[1]/d*pull; v[2]-=p[2]/d*pull;
      p[0]+=v[0];p[1]+=v[1];p[2]+=v[2]; v[0]*=.99;v[1]*=.99;v[2]*=.99;
      let x=p[0]*cosY-p[2]*sinY, z=p[0]*sinY+p[2]*cosY, y=p[1]*cosX-z*sinX; z=p[1]*sinX+z*cosX;
      const pulse=this.state==="speaking"?1+Math.sin(this.t*9+i)*bass*.08:1, sc=R*radius*pulse, pr=1/(1.9-z*.6);
      pts[i]=[cx+x*sc*pr,cy+y*sc*pr,pr,z];
    }
    c.globalCompositeOperation="lighter"; c.lineWidth=Math.max(1,dpr*.8);
    const la=(this.cur.lines*.14+bass*.08)*this.gain, th2=Math.pow(R*(.17+bass*.06),2); let drawn=0;
    if(la>.01){ c.strokeStyle=`rgba(${colour},${la})`; c.beginPath();
      for(let i=0;i<this.n&&drawn<2400;i+=3){ const a=pts[i]; for(let j=i+1;j<this.n;j+=2){ const b=pts[j]; const dx=a[0]-b[0],dy=a[1]-b[1]; if(dx*dx+dy*dy<th2*((a[2]+b[2])/2)){ c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); if(++drawn>=2400) break; } } }
      c.stroke(); }
    for(let i=0;i<this.n;i++){ const q=pts[i], a=Math.min(1,(this.cur.bright*.5+bass*.3)*(.45+q[2]*.4)*this.gain), sz=(this.cur.size*1.1+bass*.6)*q[2]*dpr; c.fillStyle=`rgba(${colour},${a})`; c.beginPath(); c.arc(q[0],q[1],sz,0,6.283); c.fill(); }
    const g=c.createRadialGradient(cx,cy,0,cx,cy,R*radius*.9); g.addColorStop(0,`rgba(${colour},${.18+bass*.25})`); g.addColorStop(1,`rgba(${colour},0)`); c.fillStyle=g; c.fillRect(0,0,W,H);
    c.globalCompositeOperation="source-over";
  }
}
let deckOrb=null, deckVisible=true, deckIO=null, voiceOrb=new Orb($("#vCanvas"),760);
function mountDeck(){ const cv=$("#deckCanvas"); if(cv&&(!deckOrb||deckOrb.cv!==cv)){ if(deckOrb) orbs.splice(orbs.indexOf(deckOrb),1); deckOrb=new Orb(cv,560,1.7); deckOrb.set(listening?"listening":speaking?"speaking":thinking?"thinking":"idle");
  if("IntersectionObserver" in window){ deckIO?.disconnect(); deckIO=new IntersectionObserver(([en])=>{deckVisible=en.isIntersecting},{threshold:0}); deckIO.observe(cv); } } }
function orbColour(){ return theme()==="dark"?"140,196,255":"37,99,235"; }
function startListening(){
  if(!canHear||listening) return; stopSpeaking();
  rec=new SR(); rec.lang="en-GB"; rec.interimResults=true; let fin="";
  rec.onresult=e=>{let tmp="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}vSet("Listening",undefined,(fin+tmp).trim())};
  rec.onend=()=>{listening=false;$("#vOrb").classList.remove("live");stopMic();orbs.forEach(o=>o.set("idle"));const t=fin.trim();
    if(/^(say that again|repeat that|again please|pardon)\.?$/i.test(t)&&lastSaid){ vSet("",lastSaid); speak(lastSaid,{replay:true}); return; }
    if(t)askText(t,true);else vSet()};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("Allow the microphone for this page to talk")};
  try{rec.start();listening=true;$("#vOrb").classList.add("live");vSet("Listening",undefined,"");startMic();orbs.forEach(o=>o.set("listening"))}catch(e){toast(e.message)}
}
function stopListening(){try{rec&&rec.stop()}catch{}}
async function startMic(){try{mic=await navigator.mediaDevices.getUserMedia({audio:true});const ctx=new(window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=256;ctx.createMediaStreamSource(mic).connect(analyser);analyser._c=ctx}catch{}}
function stopMic(){try{mic?.getTracks().forEach(t=>t.stop());analyser?._c.close()}catch{}analyser=null;mic=null}
(function draw(){
  const {lvl,bins}=audioLevel(), col=orbColour();
  if($("#voice").classList.contains("on")) voiceOrb.frame(lvl,bins,col);
  if(deckOrb&&deckVisible&&document.contains(deckOrb.cv)&&document.visibilityState==="visible") deckOrb.frame(lvl,bins,"150,204,255");
  const st=$("#deckState"); if(st){ const s=listening?"listening":speaking?"speaking":thinking?"thinking":"online"; if(st.textContent!==s) st.textContent=s; }
  requestAnimationFrame(draw);
})();

/* ============ boot ============ */
(()=>{const t=ls.get("hub.theme",null); if(t) document.documentElement.dataset.theme=t; if(!TABS.some(x=>x[0]===view)) view="today";})();
refresh(true).then(loadGreeting); setInterval(()=>refresh(false),5000); setInterval(()=>{ if(S) renderBar(); },30000);
setInterval(()=>{ if(view==="today"&&!document.querySelector("input:focus,textarea:focus")) loadGreetingQuiet(); },20*60*1000);
async function loadGreetingQuiet(){ try{ const g=await api("/api/greeting"); if(g.text!==greetingText){ greetingText=g.text; const el=$("#deckSay"); if(el) el.textContent=g.text; } }catch{} }
