name: Build CallPilot (Windows EXE)

on:
  push:
    branches: ["**"]
    paths: ["callpilot/**", ".github/workflows/build-callpilot.yml"]
    tags: ["callpilot-v*"]
  pull_request:
    paths: ["callpilot/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: callpilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: callpilot/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Build CallPilot.exe
        run: pyinstaller packaging/CallPilot.spec --noconfirm --clean

      - name: Smoke-test the EXE starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CallPilot.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "CallPilot.exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $env:CALLPILOT_VERSION = "1.0.0"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\CallPilot.iss

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist\CallPilot.exe, dist\CallPilot-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CallPilot-windows
          path: |
            callpilot/dist/CallPilot.exe
            callpilot/dist/CallPilot-Setup.exe
            callpilot/dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/callpilot-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            callpilot/dist/CallPilot.exe
            callpilot/dist/CallPilot-Setup.exe
            callpilot/dist/SHA256SUMS.txt
