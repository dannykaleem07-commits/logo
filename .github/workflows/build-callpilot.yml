name: Build CallPilot (Windows EXE)

on:
  push:
    branches: ["**"]
    paths: ["callpilot/**", ".github/workflows/build-callpilot.yml"]
    tags: ["callpilot-v*"]
  pull_request:
    paths: ["callpilot/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a versioned release (e.g. 1.0.0). Leave empty for the rolling 'latest' only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: callpilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: callpilot/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Stamp the build with the commit
        shell: pwsh
        run: |
          "COMMIT = '${{ github.sha }}'`nBUILT = '$(Get-Date -Format o)'" | Set-Content callpilot/_build.py

      - name: Unit tests
        run: python -m pytest -q

      - name: Build CallPilot.exe
        run: pyinstaller packaging/CallPilot.spec --noconfirm --clean

      - name: Smoke-test the EXE starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CallPilot.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "CallPilot.exe exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $env:CALLPILOT_VERSION = "1.0.0"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\CallPilot.iss

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash dist\CallPilot.exe, dist\CallPilot-Setup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CallPilot-windows
          path: |
            callpilot/dist/CallPilot.exe
            callpilot/dist/CallPilot-Setup.exe
            callpilot/dist/SHA256SUMS.txt

      # Rolling release: every green build on the main development branch refreshes
      # the 'callpilot-latest' release, so the download link below never changes:
      #   https://github.com/${{ github.repository }}/releases/download/callpilot-latest/CallPilot-Setup.exe
      - name: Move the callpilot-latest tag to this commit
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f callpilot-latest
          git push -f origin callpilot-latest

      - name: Publish rolling 'latest' release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: callpilot-latest
          name: "CallPilot – latest build"
          prerelease: true
          body: |
            Latest automated Windows build of CallPilot (Call Desk) from commit ${{ github.sha }}.

            **Download:** `CallPilot-Setup.exe` (installer) or `CallPilot.exe` (portable, no install).
            Windows 10 2004+ / Windows 11. SmartScreen: *More info → Run anyway* (not code-signed).
            Verify with `SHA256SUMS.txt`.
          files: |
            callpilot/dist/CallPilot.exe
            callpilot/dist/CallPilot-Setup.exe
            callpilot/dist/SHA256SUMS.txt

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/callpilot-v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/callpilot-v') && github.ref_name || format('callpilot-v{0}', inputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/callpilot-v') && github.ref_name || format('CallPilot {0}', inputs.version) }}
          files: |
            callpilot/dist/CallPilot.exe
            callpilot/dist/CallPilot-Setup.exe
            callpilot/dist/SHA256SUMS.txt
