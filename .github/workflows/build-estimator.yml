name: Build Engineer Report Studio (Windows)

on:
  push:
    paths:
      - 'estimator/**'
      - '.github/workflows/build-estimator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (unit, mocked APIs, UI smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimator
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estimator/package-lock.json
      - run: npm ci
      - name: Unit and mocked-API tests
        run: npm test
      - name: Install Chromium for the UI smoke test
        run: npx playwright install --with-deps chromium
      - name: UI smoke test (every screen and flow, mocked desktop bridge)
        run: node tools/ui-smoketest.js
      - name: Download the Electron binary
        run: node node_modules/electron/install.js
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      - name: End-to-end test in real Electron (mocked DVLA, DVSA and Anthropic)
        run: xvfb-run -a npx electron --no-sandbox tools/electron-e2e.js

  windows:
    name: Build Windows installer and portable .exe
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: estimator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: estimator/package-lock.json
      - run: npm ci
      - name: Unit and mocked-API tests
        run: npm test
      - name: End-to-end test in real Electron on Windows (mocked DVLA, DVSA and Anthropic)
        run: npx electron tools/electron-e2e.js
      - name: Build Windows installer and portable .exe
        run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: Engineer-Report-Studio-Windows
          path: |
            estimator/dist/*.exe
          if-no-files-found: error
